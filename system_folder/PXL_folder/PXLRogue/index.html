<style>
  /* dvh is the height that is actually showing once the address bar
     has slid away; the plain percentage is the fallback. */
  html,body{margin:0;padding:0;height:100%;height:100dvh;
            background:#05060d;overflow:hidden;overscroll-behavior:none;}
  body{display:flex;align-items:center;justify-content:center;}
  /* The canvas backing store is EXACTLY 230x128 device pixels.
     It is only ever blown up by a whole-number factor, with all
     smoothing disabled, so every source pixel stays a perfect square. */
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    image-rendering:-moz-crisp-edges;
    -ms-interpolation-mode:nearest-neighbor;
    display:block;
    background:#0b0d1c;
    /* the game draws its own pointer, off the sheet, at 230x128 */
    cursor:none;
    /* A finger works the controls, so the browser must not also read it
       as scrolling, zooming, selecting or a link being tapped. */
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 0 0 1px #1b2140;
  }
  #nosheet{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center; text-align:center;
    color:#c3ccd9; background:#05060d; padding:20px;
    font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;
  }
</style>

var MAP_W = 64, MAP_H = 32;          /* the floor you are on; both vary */

var MAP_MIN_H = 29, MAP_MAX_H = 44;

var MAX_DEPTH = 26;
var LIT_RADIUS = 9, TORCH_RADIUS = 4;

var DARK_ROOM_PCT = 16;            /* how many rooms are pitch dark */
var DARK_HALL_PCT = 14;            /* and how often a hallway goes dark */

/* Four kinds of each, so a mossy floor and a cracked one do not read as
   the same two tiles repeated.  Everything that used to name the two by
   hand asks these instead. */
/* The looks a wand can wear.  A metal one is a wand, a wooden one is a
   staff, and each shape has more than one carving. */
/* The carvings a runed stone can wear.  Which rune wears which is dealt
   afresh every run - see makeAppearances. */
/* Which of the four wall faces a square wears.  A pure function of where
   the square is, so the renderer and the floor builder always agree
   without either storing anything. */
/* A square's own number, well mixed.  The hash used to be x*7 + y*13
   with a little of x*y stirred in, which lines up with itself: how often
   each face turned up depended on which patch of the map you looked at,
   and a room could come out a third broken wall. */
function tileHash(x, y) {
  var h = (x | 0) * 374761393 + (y | 0) * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) >>> 0;
}
/* Four wall faces, and what each is for: `wall` is the plain course and
   most of the dungeon is built of it; `wall2` is broken stonework, which
   turns up here and there rather than every other block; `wall3` and
   `wall_moss` are both mossy, and a mossy stretch draws from the two of
   them so it does not read as one tile repeated. */
function wallVariant(x, y) {
  var h = tileHash(x, y) % 16;
  if (h === 0) return 'wall_moss';
  if (h === 1) return 'wall3';
  if (h === 2 || h === 9) return 'wall2';
  return 'wall';
}

          var edge = (x === 0 || y === 0 || x === w - 1 || y === h - 1);
          if (!edge) {
            if (!snap[y - 1][x] || !snap[y + 1][x] || !snap[y][x - 1] || !snap[y][x + 1]) edge = true;
          }
          if (edge && rnd(100) < 28) m[y][x] = false;
        }
      }
      break;
    }
    case 'pillars': {
      fillMask(m, w, h, true);
      if (w >= 7 && h >= 5) {
        /* A hall has a few pillars, not a forest of them: the old rule
           studded every other square and a big room came out as a grid. */
        var spots = [];
        for (y = 2; y < h - 2; y += 2) for (x = 2; x < w - 2; x += 2) spots.push([x, y]);
        shuffle(spots);
        var want = Math.min(PILLARS_MAX, 1 + rnd(PILLARS_MAX), spots.length);
        for (var pi = 0; pi < want; pi++) m[spots[pi][1]][spots[pi][0]] = false;
      }
      break;
    }
    case 'pillar4': {
      /* one square pillar of four wall tiles in the middle of the room */
      fillMask(m, w, h, true);
      if (w >= 6 && h >= 5) {
        var px0 = (w >> 1) - 1, py0 = (h >> 1) - 1;
        m[py0][px0] = false; m[py0][px0 + 1] = false;
        m[py0 + 1][px0] = false; m[py0 + 1][px0 + 1] = false;
      }
      break;
    }
    case 'twin': {
      var aw = 3 + rnd(Math.max(1, w - 3)), ah = 2 + rnd(Math.max(1, h - 2));
      var ax = rnd(w - aw + 1), ay = rnd(h - ah + 1);
      var bw = 3 + rnd(Math.max(1, w - 3)), bh = 2 + rnd(Math.max(1, h - 2));
      var bx = rnd(w - bw + 1), by = rnd(h - bh + 1);
      for (y = ay; y < ay + ah; y++) for (x = ax; x < ax + aw; x++) m[y][x] = true;
      for (y = by; y < by + bh; y++) for (x = bx; x < bx + bw; x++) m[y][x] = true;
      break;
    }
  }
  return largestBlob(m, w, h);
}

/* keep only the biggest 4-connected component so a room is never split */
function largestBlob(m, w, h) {
  var lab = blankMask(w, h), best = null, bestN = 0, x, y;
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
    if (!m[y][x] || lab[y][x]) continue;
    var q = [[x, y]], cells = [];
    lab[y][x] = true;
    while (q.length) {
      var c = q.pop(); cells.push(c);
      for (var d = 0; d < 4; d++) {
        var nx = c[0] + DIR4[d][0], ny = c[1] + DIR4[d][1];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        if (!m[ny][nx] || lab[ny][nx]) continue;
        lab[ny][nx] = true; q.push([nx, ny]);
      }
    }
    if (cells.length > bestN) { bestN = cells.length; best = cells; }
  }
  var out = blankMask(w, h);
  if (best) for (var i = 0; i < best.length; i++) out[best[i][1]][best[i][0]] = true;
  return { mask: out, count: bestN };
}

/* Scatter rooms across the floor at random, keeping a lane of raw rock
   between any two of them so a corridor can run down it.  Nothing is on a
   grid, so no two floors have the same rhythm. */
function scatterRooms() {
  /* Fewer, roomier chambers: a floor of big spaces joined by a handful of
     passages reads better than a warren of little ones. */
  var target = clamp(Math.round(MAP_W * MAP_H / 205), 5, 10);
  var rects = [], tries = 0;
  while (rects.length < target && tries++ < 1600) {
    var fw = 8 + rnd(11), fh = 6 + rnd(7);
    if (fw > MAP_W - 6) fw = MAP_W - 6;
    if (fh > MAP_H - 6) fh = MAP_H - 6;
    var rx = 2 + rnd(Math.max(1, MAP_W - fw - 3));
    var ry = 2 + rnd(Math.max(1, MAP_H - fh - 3));
    var clash = 0;
    for (var q = 0; q < rects.length; q++) {
      var o = rects[q];
      /* three tiles clear: their wall, a rock lane, our wall */
      if (rx - 3 < o.x + o.w && rx + fw + 3 > o.x &&
          ry - 3 < o.y + o.h && ry + fh + 3 > o.y) { clash = 1; break; }
    }
    if (!clash) rects.push({ x: rx, y: ry, w: fw, h: fh });
  }
  return rects;
}

/* Two doorways side by side read as a mistake.  Nearly all of them are
   headed off while the corridors are dug; the handful that survive are
   load bearing on both sides, and the cheapest cure for those is to deal
   the floor again. */
function touchingDoors(L) {
  var T = L.tiles, i, d;
  for (i = 0; i < T.length; i++) {
    var t = T[i];
    if (t !== DOOR && t !== SDOOR && t !== LOCKED) continue;
    var x = i % MAP_W, y = (i / MAP_W) | 0;
    if (x < 1 || y < 1 || x >= MAP_W - 1 || y >= MAP_H - 1) continue;
    for (d = 0; d < 4; d++) {
      var n = T[(y + DIR4[d][1]) * MAP_W + (x + DIR4[d][0])];
      if (n === DOOR || n === SDOOR || n === LOCKED) return true;
    }
  }
  return false;
}

function genLevel(depth) {
  var L, best = null;
  for (var attempt = 0; attempt < 10; attempt++) {
    L = genLevelOnce(depth);
    if (touchingDoors(L)) continue;
    /* and nowhere walled off by accident: a stranded corridor stub is
       cheaper to re-deal than to repair */
    if (!everywhereReachable(L)) { best = best || L; continue; }
    return L;
  }
  return best || L;
}

/* A spring of holy water: a small blob of bright water inside a course of
   dressed stone.  There are only ever two or three in the whole dungeon,
   and never two on the same floor. */
function pickHolyFloors() {
  var n = HOLY_MIN + rnd(HOLY_MAX - HOLY_MIN + 1), out = [], guard = 0;
  while (out.length < n && guard++ < 200) {
    var d = 2 + rnd(23);
    if (out.indexOf(d) < 0) out.push(d);
  }
  return out;
}
/* ================================================== special rooms
   Most rooms are somewhere to fight in.  A few are somewhere to make a
   decision in, and those are the ones you remember.  At most one per
   floor, in a room big enough to be worth the walk. */
var SPECIAL_CHANCE = 42;          /* per floor, if a room will take one */

function roomOpenSpots(L, r) {
  var out = [], i;
  for (i = 0; i < r.floors.length; i++) {
    var x = r.floors[i][0], y = r.floors[i][1];
    if (L.tiles[y * MAP_W + x] !== FLOOR) continue;
    if (x === L.stair.x && y === L.stair.y) continue;
    if (itemAt(L, x, y)) continue;
    if (decorHides(x, y, L)) continue;      /* nothing goes under a table */
    out.push([x, y]);
  }
  shuffle(out);
  return out;
}

/* --- the nursery: a brood asleep, and something worth waking them for */
function makeNursery(L, r, depth) {
  var spots = roomOpenSpots(L, r);
  if (spots.length < 8) return false;
  /* A brood is by definition several of one kind, so the kind must be
     one there can be several of.  A nursery of leprechauns put seven of
     the one-to-a-floor thief on a single floor. */
  var c = null, i;
  for (i = 0; i < 24 && !c; i++) {
    var cand = randMonsterChar(depth);
    if (!MON_BY_CHAR[cand] || !MON_BY_CHAR[cand].only) c = cand;
  }
  if (!c) return false;
  var n = 5 + rnd(4);
  for (i = 0; i < n && i < spots.length - 1; i++) {
    if (monAt(L, spots[i][0], spots[i][1])) continue;
    var m = mkMonster(c, depth, spots[i][0], spots[i][1]);
    m.state = 0;                  /* fast asleep, every one of them */
    m.home = r.idx;
    L.mons.push(m);
  }
  /* the last open spot, unless that happens to be the doorway - a chest
     in the mouth of a door corks the only way in */
  var cs = null;
  for (i = spots.length - 1; i >= 0 && !cs; i--)
    if (!blocksDoorway(spots[i][0], spots[i][1], L)) cs = spots[i];
  if (!cs) cs = spots[spots.length - 1];
  var chest = mkChest(depth, 0, 1);
  chest.x = cs[0];
  chest.y = cs[1];
  L.items.push(chest);
  r.special = 'nursery';
  return true;
}

/* --- the shrine: every curse lifted, for a piece of you */
function makeShrine(L, r, depth) {
  var spots = roomOpenSpots(L, r);
  if (!spots.length) return false;
  var at = spots[0];
  L.tiles[at[1] * MAP_W + at[0]] = HOLY;
  L.shrine = { x: at[0], y: at[1], used: 0 };
  /* a ring of bones round it, so it reads as a place people came to */
  for (var d = 0; d < 8; d++) {
    var bx = at[0] + DIR8[d][0], by = at[1] + DIR8[d][1];
    if (L.tiles[by * MAP_W + bx] !== FLOOR) continue;
    if (itemAt(L, bx, by)) continue;          /* never bury the loot */
    if (L.decor[by * MAP_W + bx]) continue;   /* nor paint over the cracks */
    if (rnd(100) < 55) L.decor[by * MAP_W + bx] = rnd(2) ? 'bones' : 'skull';
  }
  r.special = 'shrine';
  return true;
}

/* --- the alchemist's cell: shelves of unknowns, and one answer */
function makeAlchemist(L, r, depth) {
  var spots = roomOpenSpots(L, r);
  if (spots.length < 10) return false;
  var n = 7 + rnd(4), i;
  for (i = 0; i < n && i < spots.length - 1; i++) {
    var pot = mkItem('potion', weightedPick(POTIONS));
    pot.x = spots[i][0]; pot.y = spots[i][1];
    delete L.decor[pot.y * MAP_W + pot.x];
    L.items.push(pot);
  }
  var at = spots[spots.length - 1];
  L.tiles[at[1] * MAP_W + at[0]] = HOLY;
  L.alchemy = { x: at[0], y: at[1], used: 0 };
  r.special = 'alchemist';
  return true;
}

/* Take the furnishings out of a room.  Rooms are dressed before anybody
   decides what they are, so a room chosen to be something in particular
   starts by clearing what was put in it. */
function clearDecor(L, r) {
  var i, lifted = 0;
  for (i = 0; i < r.floors.length; i++) {
    var j = r.floors[i][1] * MAP_W + r.floors[i][0];
    var d = L.decor[j];
    if (!d || !FURNISHINGS[d] && !isRugName(d)) continue;
    delete L.decor[j];
    if (L.rugId) delete L.rugId[j];
    if (L.barrels) delete L.barrels[j];
    lifted++;
  }
  return lifted;
}

/* --- the moss garden: rest here, but something will find you */
function makeMossGarden(L, r, depth) {
  var i;
  if (r.floors.length < 12) return false;
  /* Clear the room out first.  It is furnished before anybody decides
     what it is, and a rug laid over most of the floor left a garden with
     moss on three squares of fifteen - the rest of it was carpet. */
  clearDecor(L, r);
  /* And nothing underfoot.  It is the one room on the floor you can stop
     in, and a trap in it makes stopping the mistake. */
  for (i = L.traps.length - 1; i >= 0; i--) {
    var tp = L.traps[i];
    if (L.roomAt[tp.y * MAP_W + tp.x] === r.idx) L.traps.splice(i, 1);
  }
  for (i = 0; i < r.floors.length; i++) {
    var x = r.floors[i][0], y = r.floors[i][1];
    if (L.tiles[y * MAP_W + x] !== FLOOR) continue;
    if (L.decor[y * MAP_W + x]) continue;
    if (itemAt(L, x, y)) continue;
    if (rnd(100) < 88) L.decor[y * MAP_W + x] = pick(MOSS_FIELD);
  }
  r.special = 'moss';
  r.lit = 0;                       /* dim and overgrown */
  /* moss does not hide anything, so the room is still usable */
  return true;
}

/* How many separate pieces the walkable floor is in.  Sealed rooms and
   rooms behind a secret door are pieces of their own and always were, so
   the number is only ever used to compare a floor against itself.  Ask
   for the list and it hands back the pieces themselves. */
function openParts(L, barrelsSolid, wantList) {
  var T = L.tiles, n = T.length, seen = new Uint8Array(n), out = [], i, d;
  function open(j) {
    return walkTile(T[j]) && !(barrelsSolid && L.barrels && L.barrels[j]);
  }
  for (i = 0; i < n; i++) {
    if (seen[i] || !open(i)) continue;
    var st = [i], comp = [];
    seen[i] = 1;
    while (st.length) {
      var j = st.pop(), x = j % MAP_W, y = (j / MAP_W) | 0;
      comp.push(j);
      for (d = 0; d < DIR4.length; d++) {
        var k = (y + DIR4[d][1]) * MAP_W + x + DIR4[d][0];
        if (k < 0 || k >= n || seen[k] || !open(k)) continue;
        seen[k] = 1; st.push(k);
      }
    }
    out.push(comp);
  }
  return wantList ? out : out.length;
}

/* A door has to be a door: stone on one side and a way through on the
   other.  A corridor that arrives two squares wide, or a room that opens
   out beside one, leaves a door standing in the open with floor all round
   it - which reads as a door dropped in the middle of a room, because
   that is what it is.

   It is not a door, so it stops being one and becomes the opening it
   already was: hallway where it adjoins hallway, room floor where it
   adjoins nothing but room. */
function tidyDoors(L) {
  var T = L.tiles, n = T.length, i, d, fixed = 0;
  /* Anything you cannot walk onto counts as the jamb, not just dressed
     stone: a door set into a line of iron bars is a door, and listing the
     two kinds of wall by hand opened the mint. */
  function solid(v) { return !walkTile(v); }
  for (i = 0; i < n; i++) {
    var t = T[i];
    /* A locked door is there on purpose and something is behind it.  If
       one of those ever looks loose, leave it: opening a vault is a
       worse fault than a door in an odd place. */
    if (t !== DOOR && t !== SDOOR) continue;
    if (L.locks[i]) continue;
    var x = i % MAP_W, y = (i / MAP_W) | 0;
    if (x < 1 || y < 1 || x >= MAP_W - 1 || y >= MAP_H - 1) continue;
    var up = T[i - MAP_W], dn = T[i + MAP_W], lf = T[i - 1], rt = T[i + 1];
    if ((solid(up) && solid(dn)) || (solid(lf) && solid(rt))) continue;
    /* not set in anything: whatever it is, it is not a door */
    var corridor = 0;
    for (d = 0; d < DIR4.length; d++)
      if (T[(y + DIR4[d][1]) * MAP_W + (x + DIR4[d][0])] === CORR) corridor = 1;
    T[i] = (corridor && L.roomAt[i] < 0) ? CORR : FLOOR;
    delete L.locks[i];
    delete L.doorMat[i];
    fixed++;
  }
  return fixed;
}

/* Nothing stands on a barrel, so a barrel can wall a way through.  Take
   out any that does. */
function tidyBarrels(L) {
  var removed = 0, guard = 0, i, d;
  while (guard++ < 30 && openParts(L, 1) > openParts(L, 0)) {
    /* Find the piece of floor that has been cut off and take away a
       barrel standing on the edge of it.

       Trying each barrel in turn and keeping whichever one joined the
       most floor back on sounds equivalent and is not: two barrels can
       plug a way through together, and with one of them still in place
       taking the other away joins nothing, so every candidate scored the
       same and nothing was ever removed. */
    var parts = openParts(L, 1, 1), got = 0;
    parts.sort(function (a, b) { return a.length - b.length; });
    /* A loose barrel goes before one out of a store: a store is a room
       somebody built, and a loose barrel is only a barrel. */
    for (var pass = 0; pass < 2 && !got; pass++) {
      for (i = 0; i < parts.length && !got; i++) {
        var comp = parts[i];
        for (var c = 0; c < comp.length && !got; c++) {
          var x = comp[c] % MAP_W, y = (comp[c] / MAP_W) | 0;
          for (d = 0; d < DIR4.length; d++) {
            var k = (y + DIR4[d][1]) * MAP_W + x + DIR4[d][0];
            if (k < 0 || k >= L.tiles.length || !L.barrels[k]) continue;
            var ri = L.roomAt[k];
            var store = ri >= 0 && L.rooms[ri] && L.rooms[ri].special === 'powder';
            if (!pass && store) continue;
            delete L.barrels[k];
            delete L.decor[k];
            removed++; got = 1;
            break;
          }
        }
      }
    }
    if (!got) break;                 /* nothing left that a barrel is doing */
  }
  return removed + tidyStores(L);
}

/* A powder store is a pile: every barrel touches another, so one going up
   takes the lot.  Taking a barrel out of one to clear a way through can
   leave a barrel, or a clump of them, standing on its own - and a barrel
   on its own in a powder store is a thing that does not go off when the
   rest of the room does.  Keep the biggest clump and clear the strays. */
function tidyStores(L) {
  var removed = 0, i, k, d;
  for (i = 0; i < L.rooms.length; i++) {
    var r = L.rooms[i];
    if (r.gone || r.special !== 'powder') continue;
    var mine = [];
    for (k in L.barrels) if (L.roomAt[k | 0] === r.idx) mine.push(k | 0);
    if (mine.length < 2) continue;
    var inSet = {};
    for (k = 0; k < mine.length; k++) inSet[mine[k]] = 1;
    var seen = {}, best = null;
    for (k = 0; k < mine.length; k++) {
      if (seen[mine[k]]) continue;
      var st = [mine[k]], clump = [];
      seen[mine[k]] = 1;
      while (st.length) {
        var j = st.pop(), x = j % MAP_W, y = (j / MAP_W) | 0;
        clump.push(j);
        for (d = 0; d < DIR8.length; d++) {
          var n2 = (y + DIR8[d][1]) * MAP_W + (x + DIR8[d][0]);
          if (!inSet[n2] || seen[n2]) continue;
          seen[n2] = 1; st.push(n2);
        }
      }
      if (!best || clump.length > best.length) best = clump;
    }
    if (!best) continue;
    var keep = {};
    for (k = 0; k < best.length; k++) keep[best[k]] = 1;
    for (k = 0; k < mine.length; k++) {
      if (keep[mine[k]]) continue;
      delete L.barrels[mine[k]];
      delete L.decor[mine[k]];
      removed++;
    }
  }
  return removed;
}

/* --- the powder store: barrels, and a very short argument */
function makePowderStore(L, r, depth) {
  var spots = roomOpenSpots(L, r);
  if (spots.length < 6) return false;
  /* Stacked against each other, not scattered - a barrel across the room
     from the rest is not a powder store, it is a barrel.  Grow the pile
     outward from one spot so every barrel touches another.

     Nothing stands on a barrel, so the pile must not wall the room off
     either.  Each one is refused as it is put down rather than taken away
     afterwards: a pile tidied afterwards loses barrels out of its middle
     and stops being a pile, and a barrel that is refused must never have
     been part of it, or the next one grows off a square that is not
     there and the pile comes apart in two halves. */
  var want = 5 + rnd(5), i, d;
  var free = {};
  for (i = 0; i < spots.length; i++) free[spots[i][1] * MAP_W + spots[i][0]] = 1;
  L.barrels = L.barrels || {};
  var parts = openParts(L, 1), laid = [];
  function put(x, y) {
    var j = y * MAP_W + x;
    L.decor[j] = 'barrel';
    L.barrels[j] = 1;
    if (openParts(L, 1) > parts) {
      delete L.decor[j]; delete L.barrels[j];
      return 0;
    }
    laid.push(j);
    return 1;
  }
  function takeItAllBack() {
    for (var q = 0; q < laid.length; q++) {
      delete L.decor[laid[q]]; delete L.barrels[laid[q]];
    }
  }
  var taken = {};
  taken[spots[0][1] * MAP_W + spots[0][0]] = 1;
  if (!put(spots[0][0], spots[0][1])) return false;
  var pile = [spots[0]], guard = 0;
  while (pile.length < want && guard++ < 200) {
    var from = pile[rnd(pile.length)];
    d = rnd(8);
    var nx = from[0] + DIR8[d][0], ny = from[1] + DIR8[d][1], k = ny * MAP_W + nx;
    if (!free[k] || taken[k]) continue;
    taken[k] = 1;                       /* tried, whether it went down or not */
    if (!put(nx, ny)) continue;
    pile.push([nx, ny]);
  }
  if (pile.length < 4) { takeItAllBack(); return false; }
  r.special = 'powder';
  return true;
}

/* --- and one left standing about, away from the store
   A lone barrel is a hazard rather than a room, and it wants clear ground
   round it: not tucked into a doorway, not under a staircase, and never
   touching another one.  Two barrels side by side are the beginning of a
   pile, and a pile belongs in the powder store.

   This runs after the floor has stopped changing, for the same reason the
   moss does - a barrel placed before the streams are cut can end up in
   the water. */
function scatterBarrels(L, depth) {
  if (depth < STRAY_BARREL_DEPTH) return 0;
  if (rnd(100) >= STRAY_BARREL_PCT) return 0;
  L.barrels = L.barrels || {};
  var want = 1 + rnd(STRAY_BARREL_MAX), put = 0, tries = 0;
  while (put < want && tries++ < want * 40) {
    var r = randRoom(L);
    if (!r || r.gone || r.special === 'powder') continue;
    var s = randSpot(L, r), j = s.y * MAP_W + s.x;
    if (L.tiles[j] !== FLOOR || L.decor[j]) continue;
    if (s.x === L.stair.x && s.y === L.stair.y) continue;
    if (L.up && s.x === L.up.x && s.y === L.up.y) continue;
    if (itemAt(L, s.x, s.y) || trapAtLevel(L, s.x, s.y)) continue;
    var ok = 1;
    for (var d = 0; d < DIR8.length; d++) {
      var nx = s.x + DIR8[d][0], ny = s.y + DIR8[d][1];
      if (nx < 1 || ny < 1 || nx >= MAP_W - 1 || ny >= MAP_H - 1) { ok = 0; break; }
      var k = ny * MAP_W + nx, t = L.tiles[k];
      if (L.barrels[k]) { ok = 0; break; }
      if (t === DOOR || t === STAIR || t === STAIR_UP) { ok = 0; break; }
    }
    if (!ok) continue;
    L.decor[j] = 'barrel';
    L.barrels[j] = 1;
    put++;
  }
  return put;
}

/* --- the mint: gold you can see and cannot reach without the key */
function makeMint(L, r, depth) {
  if (r.w < 6 || r.h < 4) return false;
  /* cut the room in two with a line of bars, and put the money behind */
  var vertical = r.w >= r.h;
  var cut = vertical ? r.x + 2 + rnd(Math.max(1, r.w - 4))
                     : r.y + 2 + rnd(Math.max(1, r.h - 4));
  var behind = [], bars = [], i;
  for (i = 0; i < r.floors.length; i++) {
    var x = r.floors[i][0], y = r.floors[i][1];
    if (L.tiles[y * MAP_W + x] !== FLOOR) continue;
    var v = vertical ? x : y;
    if (v === cut) bars.push([x, y]);
    else if (v > cut) behind.push([x, y]);
  }
  /* three bars at least: one becomes the locked gate, and a grille of
     a single bar is not a grille */

var SPECIAL_ROOMS = [

  { n: 'shrine', f: makeShrine, min: 1 },
  { n: 'alchemist', f: makeAlchemist, min: 2 },
  { n: 'moss', f: makeMossGarden, min: 1 },
  { n: 'powder', f: makePowderStore, min: 3 },
  { n: 'mint', f: makeMint, min: 4 }

/* Is there a staircase anywhere in this room?  r.floors is the list from

    if (t === STAIR || t === STAIR_UP) return true;

    if (L.up && roomHolds(r, L.up.x, L.up.y)) continue;
    /* and nothing with a staircase actually cut into it, whatever the
       room's own list of floors says */
    if (roomHasStair(L, r)) continue;

    for (var j = 0; j < rooms.length; j++)

     spots and take the one with the most room around it. */

      var qx = cand[0] + sx, qy = cand[1] + sy;

    var x = c0[0] + shape[i][0], y = c0[1] + shape[i][1], j = y * MAP_W + x;
    if (L.tiles[j] !== FLOOR) continue;
    if (x === L.stair.x && y === L.stair.y) continue;

/* A table in the middle of a room with chairs drawn up to it.  Furniture
   is scenery: you walk round it because it looks like something, not
   because the game stops you. */

  if (r.floors.length < 20) return false;
  var cx0 = r.cx, cy0 = r.cy, j = cy0 * MAP_W + cx0;
  if (L.tiles[j] !== FLOOR || L.decor[j]) return false;
  if (cx0 === L.stair.x && cy0 === L.stair.y) return false;
  L.decor[j] = 'table';
  var placed = 1, d;
  for (d = 0; d < 4; d++) {
    if (rnd(100) < 30) continue;               /* not every seat is taken */
    var x = cx0 + DIR4[d][0], y = cy0 + DIR4[d][1], k = y * MAP_W + x;
    if (x < 1 || y < 1 || x >= MAP_W - 1 || y >= MAP_H - 1) continue;
    if (L.tiles[k] !== FLOOR || L.decor[k]) continue;
    if (x === L.stair.x && y === L.stair.y) continue;

/* Can you still walk to every square you could walk to before? */
/* Is every square you could walk on still connected to every other?  A

   allocates nothing. */
var _walkList = null, _hiddenList = null;

/* Does this lock actually divide the floor into two places worth being?

   Wall it up and flood from each side in turn.  It guards something only
   if BOTH sides hold at least one square you could stand about in - not
   counting doorways, which are ways through rather than places, and not
   counting the pockets that are walled in on purpose.

   vault that holds nothing but its own doorway, the whole rest of the
   floor is "cut off" and the lock looks vital.  Measured from outside,
   it guards an empty step.  Both sides, or it is just a door. */

    if (walkTile(T[ny * Lv.mw + nx])) sides.push(ny * Lv.mw + nx);

  var here = reachCopy(Lv, sides[0] % Lv.mw, (sides[0] / Lv.mw) | 0, true);

  for (i = 1; i < sides.length; i++) if (!here[sides[i]]) { other = sides[i]; break; }

  var there = reachCopy(Lv, other % Lv.mw, (other / Lv.mw) | 0, true);
  T[idx] = was;

    Lv.doorMat[idx] = Lv.locks[idx];
    delete Lv.locks[idx];

    if (L.roomAt[j] !== r.idx) return 0;

   beneath a staircase, is simply lifted. */

   pointing at nothing - and cracks are scattered about the floor for

   door stops it; a gap in the wall does not - which is the whole
   difference between the two.  Run again whenever a wall comes down. */
function spillLight(L) {
  if (!L.darkMap || !L.litMap) return 0;
  var open = [], seen = {}, i, x, y, lit = 0;
  for (i = 0; i < L.tiles.length; i++) {
    if (!L.litMap[i] || L.darkMap[i]) continue;
    if (!walkTile(L.tiles[i])) continue;
    open.push([i % MAP_W, (i / MAP_W) | 0, 0]);
    seen[i] = 1;
  }
  var head = 0;
  while (head < open.length) {
    var c = open[head++], cx = c[0], cy = c[1], step = c[2];
    if (step >= SPILL_RANGE) continue;
    for (var d = 0; d < 4; d++) {
      var nx = cx + DIR4[d][0], ny = cy + DIR4[d][1], k = ny * MAP_W + nx;
      if (nx < 1 || ny < 1 || nx >= MAP_W - 1 || ny >= MAP_H - 1) continue;
      if (seen[k]) continue;
      var nt = L.tiles[k];
      if (!walkTile(nt)) continue;
      /* a shut door is a shut door, whatever is burning behind it */
      if (nt === DOOR || nt === SDOOR || nt === LOCKED) continue;
      seen[k] = 1;
      /* Anywhere the light was not already, not only the rooms marked
         pitch dark.  Most unlit rooms are not marked dark at all - they
         are simply rooms nobody left a lamp in, which is the ordinary
         way a room is dark - and light stopped at the threshold of every
         one of them.  Blow a wall through into a lit room from inside
         one and nothing came in. */
      if (!L.litMap[k]) { L.darkMap[k] = 0; L.litMap[k] = 1; lit++; }
      open.push([nx, ny, step + 1]);
    }
  }
  return lit;
}

/* Moss over whatever of a moss garden is still bare floor - but not all
   of it.  This runs after the garden has already been mossed once, and
   between them the two passes used to leave a cave carpeted end to end
   with barely a square of stone showing.  A few bare spots are what the
   edge tiles are for: the moss thins as it comes up to one. */
function remossGardens(L) {
  var i, f, laid = 0;
  for (i = 0; i < L.rooms.length; i++) {
    var r = L.rooms[i];
    if (r.gone || r.special !== 'moss') continue;
    /* how many squares of bare stone this cave keeps */
    var keep = Math.max(MOSS_BARE_MIN,
      Math.round(r.floors.length * MOSS_BARE_PCT / 100));
    var bare = [];
    for (f = 0; f < r.floors.length; f++) {
      var j = r.floors[f][1] * MAP_W + r.floors[f][0];
      if (L.tiles[j] !== FLOOR) continue;
      if (!L.decor[j]) bare.push(j);
    }
    shuffle(bare);
    for (f = keep; f < bare.length; f++) {
      L.decor[bare[f]] = pick(MOSS_FIELD);
      laid++;
    }
    /* and clear a few squares that the first pass had covered, so the
       bare spots are scattered through the moss rather than only where
       the first pass happened to miss */
    var mossy = [];
    for (f = 0; f < r.floors.length; f++) {
      var k2 = r.floors[f][1] * MAP_W + r.floors[f][0];
      if (isMoss(L.decor[k2]) && !isMossEdge(L.decor[k2])) mossy.push(k2);
    }
    shuffle(mossy);
    var more = keep - Math.min(keep, bare.length);
    for (f = 0; f < more && f < mossy.length; f++) delete L.decor[mossy[f]];
  }
  return laid;
}

function buildLitMap(L) {
  var m = new Uint8Array(MAP_W * MAP_H), i, f;
  for (i = 0; i < L.rooms.length; i++) {
    var r = L.rooms[i];
    if (r.gone || !r.lit) continue;
    for (f = 0; f < r.floors.length; f++)
      m[r.floors[f][1] * MAP_W + r.floors[f][0]] = 1;
  }
  L.litMap = m;
}

function randRoom(L) {
  var solid = [];
  for (var i = 0; i < L.rooms.length; i++) if (!L.rooms[i].gone) solid.push(L.rooms[i]);
  return solid.length ? solid[rnd(solid.length)] : L.rooms[0];
}
function randSpot(L, r) {
  if (r.gone || !r.floors.length) return { x: r.x, y: r.y };
  var t, f;
  for (t = 0; t < 60; t++) {
    f = r.floors[rnd(r.floors.length)];
    if (L.tiles[f[1] * MAP_W + f[0]] === FLOOR) return { x: f[0], y: f[1] };
  }
  for (t = 0; t < r.floors.length; t++) {
    f = r.floors[t];
    if (L.tiles[f[1] * MAP_W + f[0]] === FLOOR) return { x: f[0], y: f[1] };
  }
  return { x: r.cx, y: r.cy };
}

/* ============================================================ ROGUE-8
   Part 2 : items, slot inventory, player, monsters, line of sight.
   ============================================================ */

var G = null, P = null, L = null;
var APPEAR = null, KNOWN = null;

var EQ_ORDER = ['rh', 'body', 'lh', 'head', 'feet'];
var EQ_LABEL = { rh: 'RH', body: 'BD', lh: 'LH', head: 'HD', feet: 'FT' };
var EQ_LONG = { rh: 'right hand', body: 'body', lh: 'left hand', head: 'head', feet: 'feet' };
var N_SLOTS = 20, POUCH_CAP = 10;
/* A chest is a container like a pouch, but one you leave on the floor:
   five squares, which is exactly what one has ever held. */
var CHEST_CAP = 5;

/* ---------------------------------------------------------- appearances */
function makeAppearances() {
  var i, j;
  APPEAR = { pot: [], scr: [], wand: [], wandType: [], wandSpr: [], stone: {} };
  KNOWN = { pot: [], scr: [], wand: [], weap: [] };
  /* Two different things are hidden about a piece of kit, and they are
     learned separately.  KNOWN.gear says you recognise the kind on
     sight - a long sword, not "a notched blade".  it.known says you
     know what this particular one is worth, numbers and curse and all.
     Wearing one teaches you both about that one, and the kind for good. */
  KNOWN.gear = { weapon: [], armor: [], head: [], feet: [], shield: [] };
  APPEAR.gear = { weapon: [], armor: [], head: [], feet: [], shield: [] };

  /* one look per kind of gear, so a second long sword looks like the
     first and you can put two and two together */
  var looks = shuffle(GEAR_LOOKS.slice()), li = 0;
  function dressUp(list, key) {
    for (var g = 0; g < list.length; g++) {
      if (!list[g].gen) { APPEAR.gear[key].push(''); continue; }
      APPEAR.gear[key].push(looks[li++ % looks.length]);
    }
  }
  dressUp(WEAPONS, 'weapon');
  dressUp(ARMORS, 'armor');
  dressUp(HEADS, 'head');
  dressUp(FEET, 'feet');
  dressUp(SHIELDS, 'shield');

  var cols = shuffle(P_COLORS.slice());
  for (i = 0; i < POTIONS.length; i++) { APPEAR.pot.push(cols[i]); KNOWN.pot.push(0); }

  var usedTitles = {};
  for (i = 0; i < SCROLLS.length; i++) {
    var t, guard = 0;
    do {
      t = '';
      var nw = rnd(2) + 2;
      for (j = 0; j < nw; j++) {
        var word = '', ns = rnd(2) + 1;
        for (var k = 0; k < ns; k++) word += pick(SYL);
        if (word.length > 8) word = word.substr(0, 8);
        var nt = t + (j ? ' ' : '') + word;
        if (nt.length > 22) break;
        t = nt;
      }
      if (!t) t = pick(SYL) + pick(SYL);
      guard++;
    } while (usedTitles[t] && guard < 40);
    usedTitles[t] = 1;
    APPEAR.scr.push(t);
    /* everyone knows what an identify scroll looks like */
    KNOWN.scr.push(SCROLLS[i].n === 'identify' ? 1 : 0);
  }

  /* A runed stone gives nothing away by looking at it.  Each rune wore
     its own carving, in the same order every run, so a blasting stone
     was a blasting stone the moment it appeared on the floor - which is
     the whole of what identifying one is for.  The five looks are dealt
     out afresh each game. */
  var stoneLooks = shuffle(RUNE_STONE_SPRITES.slice()), sli = 0;
  for (i = 0; i < WEAPONS.length; i++) {
    if (!WEAPONS[i].rune) continue;
    APPEAR.stone[i] = stoneLooks[sli++ % stoneLooks.length];
  }

  /* Two shapes and five carvings between them, so a run does not hand
     you six wands that all look like the same stick.  The sprite goes
     with the name: a copper wand and a birch staff are different things
     to look at as well as different words. */
  var woods = shuffle(WOODS.slice()), metals = shuffle(METALS.slice());
  var wandSprs = shuffle(WAND_SPRITES.slice()), staffSprs = shuffle(STAFF_SPRITES.slice());
  var wi = 0, mi = 0, ws = 0, ss = 0;
  for (i = 0; i < WANDS.length; i++) {
    if (rnd(2)) {
      APPEAR.wand.push(woods[wi++] + ' staff'); APPEAR.wandType.push('staff');
      APPEAR.wandSpr.push(staffSprs[ss++ % staffSprs.length]);
    } else {
      APPEAR.wand.push(metals[mi++] + ' wand'); APPEAR.wandType.push('wand');
      APPEAR.wandSpr.push(wandSprs[ws++ % wandSprs.length]);
    }
    KNOWN.wand.push(0);
  }
}

/* The whole of the game's running state, in one place, so the test
   harness and a real game can never drift apart. */
function freshG() {
  return {
    depth: 0, maxDepth: 1, turn: 0, msgq: [], msgIdx: 0, mode: 'play',
    dead: 0, deathBy: '', hungerState: 0, amuletMade: 0, bolt: null, log: [],
    level: null, floors: {}, pendingFall: 0, queuePick: null, pickJob: null, beat: 0,
    ask: null,
    perkPick: null, choice: null, pause: null, look: null,
    titleMenu: null, walk: null, ctx: null, drag: null, waiting: null,
    roomBox: null, saidWaterCurse: 0, slot: null,
    openBox: null, box: null,
    deadAt: 0, pouchT: 0, pouchLast: null,
    cur: { r: 0, c: 0 }, pcur: { r: 0, c: 0 }, sel: null, pouch: null,
    menu: null, invMode: 'normal', aim: null, invOpen: 0, splash: null,
    slots: null, hint: null, pan: null, wasDark: 0,
    shot: null, targets: [], tIdx: 0, bl: null, pouchMade: 0, throwing: null,
    monUid: 0,
    aimSq: null, drops: null,
    ret: null,
    ringsMade: {},
    holyFloors: pickHolyFloors(),
    pouchFloor: POUCH_FLOOR_MIN + rnd(POUCH_FLOOR_MAX - POUCH_FLOOR_MIN + 1)
  };
}

/* ---------------------------------------------------------- items */
function mkItem(t, k) {
  var it = { t: t, k: k, cnt: 1, hp: 0, dp: 0, ap: 0, ch: 0, cursed: 0, known: 0,
             tried: 0, x: 0, y: 0 };
  if (t === 'pouch') { it.items = new Array(POUCH_CAP).fill(null); }
  if (t === 'chest') { it.items = new Array(CHEST_CAP).fill(null); it.gold = 0; }
  if (t === 'crystal' || t === 'pin' || t === 'dynamite') { it.known = 1; }
  if (t === 'weapon' && KNOWN && KNOWN.weap && KNOWN.weap[k]) it.known = 1;
  /* A ring says what it is on the band.  It comes with its charges and
     keeps its own clock for winding one back on. */
  /* The ring of invisibility holds one charge, not three: vanishing is
     worth more than stepping five squares, so it comes rarer. */
  if (t === 'ring') {
    it.known = 1;
    /* Once a run has seen this ring, it has seen it.  Marked here rather
       than at the drop so a ring off a leprechaun counts too. */
    if (G && G.ringsMade) G.ringsMade[k] = 1;
    it.ch = RINGS[k].charges === undefined ? RING_CHARGES : RINGS[k].charges;
    it.wind = 0;
  }
  return it;
}
function pouchCount(p) {
  var c = 0;
  for (var i = 0; i < POUCH_CAP; i++) if (p.items[i]) c++;
  return c;
}
function itemDef(it) {
  switch (it.t) {
    case 'weapon': return WEAPONS[it.k];
    case 'armor': return ARMORS[it.k];
    case 'head': return HEADS[it.k];
    case 'feet': return FEET[it.k];
    case 'shield': return SHIELDS[it.k];
    case 'potion': return POTIONS[it.k];
    case 'scroll': return SCROLLS[it.k];
    case 'wand': return WANDS[it.k];
    case 'ring': return RINGS[it.k];
  }
  return null;
}
function isGear(it) { return it.t === 'armor' || it.t === 'head' || it.t === 'feet' || it.t === 'shield'; }
function gearAC(it) { return (itemDef(it).a || 0) + it.ap; }

/* Is this the very thing you are wearing or holding? */
function isEquipped(it) {
  for (var k in P.eq) if (P.eq[k] === it) return true;
  return false;
}
/* What the pack is allowed to tell you about a thing's numbers.

   A cursed breastplate protects less than a breastplate should, and a
   cursed blade hits softer - so printing the real figure gave the curse
   away before you ever put the thing on, and nobody would ever be
   caught by one.  Until you have worn it or identified it you are told
   what is ordinary for its kind, which is all you could really know by
   looking. */
function numbersKnown(it) { return !!(it.known || isEquipped(it)); }
function shownAC(it) {
  return numbersKnown(it) ? gearAC(it) : (itemDef(it).a || 0);
}

/* Which pool a piece of gear draws its rune from.  Everything worn asks
   with 'g'; a hood or a cap adds 'h' for the one rune only ever cut into
   headwear, and boots add 'f' for the one only ever cut into footwear.
   Asked in two places - what the dungeon deals out, and what a scroll of
   enchantment puts in - and they must agree. */
function gearRuneKind(it) {
  if (!it) return 'g';
  if (it.t === 'head') return 'gh';
  if (it.t === 'feet') return 'gf';
  return 'g';
}
function enchantGear(it, def) {
  if (def.bad) { layCurse(it); return; }
  var r = rnd(100);
  if (r < 16) { layCurse(it); it.ap = -(rnd(3) + 1); }
  else if (r < 26) { it.ap = rnd(2) + 1; }
  addRune(it, gearRuneKind(it), 18);
  if (it.br === 'clearwater') it.wet = 1;    /* found with a charge in it */
}

/* Give an item a rune now and then.  A bad one comes with a curse. */
function addRune(it, kind, chance) {
  if (it.br) return;
  if (rnd(100) >= chance) return;
  /* Both sides are sets of letters: the item asks with 'w', 'g' or 'gh',
     and a rune answers with the slots it can be cut into.  This used to
     ask whether the rune's whole type appeared inside the item's, which
     works for single letters and silently fails for anything longer -
     'w'.indexOf('wg') is -1, so the one rune that goes on both a blade
     and a breastplate could never be rolled at all. */
  var pool = [], i, c;
  for (i = 0; i < RUNES.length; i++) {
    var fits = false;
    for (c = 0; c < RUNES[i].t.length; c++)
      if (kind.indexOf(RUNES[i].t.charAt(c)) >= 0) fits = true;
    if (fits) pool.push(RUNES[i]);
  }
  var pick2 = pool[weightedPick(pool)];
  it.br = pick2.n;
  if (pick2.bad) layCurse(it);
}
function runeDef(it) { return it && it.br ? RUNE_BY_NAME[it.br] : null; }
/* The rune that is actually doing something: a latent one sleeps until
   you have identified the item it is cut into. */
/* An enchantment is a secret whatever it is.  Putting a thing on tells
   you what the thing is - its name, its plusses, whether it is cursed -
   and nothing at all about the magic worked into it.  For that you have
   to study it or read a scroll over it, and until you have, it does
   nothing: an enchantment you do not know about is one you are not
   getting the benefit of. */
function activeRune(it) {
  var r = runeDef(it);
  if (!r) return null;
  if (!it.brKnown) return null;
  return r;
}
/* and the one place that lets the secret out */
function learnRune(it) {
  if (!it || !it.br || it.brKnown) return 0;
  it.brKnown = 1;
  return 1;
}
/* ------------------------------------------------- clearwater
   A cap of clearwater holds a charge of water.  Worn wet it hides you
   for ten turns.  Take it off, or strike anything, and the charge is
   spent and you are there again.  The only way to fill it is to leave it
   in the water and pick it up dripping. */
function isClearwater(it) {
  return !!(it && it.t === 'head' && it.br === 'clearwater');
}
function wearClearwater(it) {
  if (!isClearwater(it) || !activeRune(it)) return;
  if (!it.wet) { msg('The cap is dry. Nothing happens.', '6'); return; }
  it.wet = 0;
  P.unseen = Math.max(P.unseen, CLEARWATER_TURNS);
  msg('Cold water runs down your face. You fade out of sight.', 'c');
}
/* Everything that happens when a worn thing comes off.  It lives here so
   the one path is what the tests exercise as well. */
function takeOffEffects(it) {
  if (isClearwater(it)) breakClearwater('You are visible again.');
}

/* whatever ends it - taking the thing off, or hitting something */
function breakClearwater(why) {
  if (P.unseen <= 0) return 0;
  P.unseen = 0;
  msg(why, 'y');
  return 1;
}

/* ------------------------------------------------------------- perks
   You either have one or you do not.  Every effect in the game asks this
   one question, in the one place that already computes the number the
   perk is meant to change. */
function hasPerk(id) { return !!(P.perks && P.perks[id]); }

/* ----------------------------------------------------------- wading
   Water is thigh deep.  Every second step through it costs you the turn
   - the dungeon gets a move and you do not - so a pool is somewhere you
   can be caught rather than a blue patch of floor.

   Riverborn turns that on its head, and it is not only about crossing:
   standing in water, every second thing you do is free, so you act twice
   for each turn the dungeon takes.  Water becomes your ground. */
function inWater(x, y) {
  var tt = tileAt(x, y);
  return tt === WATER || tt === HOLY;
}
/* what a step just cost you: 1 for a lost turn, -1 for a free one, 0 for
   an ordinary step */
function wadeStep(moved) {
  if (!inWater(P.x, P.y)) { P.wade = 0; return 0; }
  P.wade = (P.wade || 0) + 1;
  if (hasPerk('riverborn')) {
    /* anything at all, not just a step: you are at home in it */
    if (P.wade < RIVER_FREE_EVERY) return 0;
    P.wade = 0;
    return -1;
  }
  /* but wading is about getting across.  Swinging a sword while you
     stand in it is no slower than swinging it anywhere else. */
  if (!moved) { P.wade--; return 0; }
  if (P.wade < WADE_EVERY) return 0;
  P.wade = 0;
  return 1;
}
/* and the same for a creature, unless the water is nothing to it */
function monWades(m) {
  if (m.def.swim || m.def.fly) return false;
  if (!inWater(m.x, m.y)) { m.wade = 0; return false; }
  m.wade = (m.wade || 0) + 1;
  if (m.wade < WADE_EVERY) return false;
  m.wade = 0;
  return true;                      /* this step is spent getting through it */
}
function perkList() {
  var out = [], i;
  for (i = 0; i < PERKS.length; i++) if (hasPerk(PERKS[i].id)) out.push(PERKS[i]);
  return out;
}
/* the ones still on the table, in a random order */
function perkOffer() {
  var pool = [], i;
  for (i = 0; i < PERKS.length; i++) if (!hasPerk(PERKS[i].id)) pool.push(PERKS[i]);
  shuffle(pool);
  return pool.slice(0, PERK_OFFER);
}
function takePerk(id) {
  if (!PERK_BY_ID[id]) return false;
  P.perks[id] = 1;
  msg('You have learned: ' + PERK_BY_ID[id].n + '.', 'c');
  msg(cap(PERK_BY_ID[id].txt) + '.', 'c');
  return true;
}
/* Does this level hand you the choice?  Only the listed ones do, and
   only the first time you reach them - draining a level and earning it
   back does not pay out twice. */
function perkLevel(lv) { return PERK_LEVELS.indexOf(lv) >= 0; }

function hasRune(name) {
  var e = equippedItems();
  for (var i = 0; i < e.length; i++) {
    var r = activeRune(e[i]);
    if (r && r.n === name) return e[i];
  }
  return null;
}
/* The same, but only what you are wearing.  A rune that can be cut into
   either a blade or a breastplate has a different job in each, and the
   armour's job must not be done by the sword in your hand. */
function hasGearRune(name) {
  var i, keys = ['body', 'lh', 'head', 'feet'];
  for (i = 0; i < keys.length; i++) {
    var it = P.eq[keys[i]];
    if (!it || !isGear(it)) continue;
    var r = activeRune(it);
    if (r && r.n === name) return it;
  }
  return null;
}
function weaponRune() {
  return P.eq.rh ? activeRune(P.eq.rh) : null;
}

/* Some weapons do not belong near the surface.  Roll again rather than
   handing a throwing dagger to somebody on the first floor. */
function pickWeaponFor(depth) {
  for (var t = 0; t < 24; t++) {
    var k = weightedPick(WEAPONS);
    var W = WEAPONS[k];
    if (!W.minDepth || depth >= W.minDepth) return k;
  }
  return weaponIndex('dagger');
}

function newItem(depth) {
  var t = THINGS[weightedPick(THINGS)].t, it, k;
  switch (t) {
    case 'food': it = mkItem('food', weightedPick(FOODS)); break;
    case 'potion': it = mkItem('potion', weightedPick(POTIONS)); break;
    case 'scroll': it = mkItem('scroll', weightedPick(SCROLLS)); break;
    case 'wand': k = weightedPick(WANDS); it = mkItem('wand', k); it.ch = 3 + rnd(8); break;
    case 'weapon': {
      k = pickWeaponFor(depth); it = mkItem('weapon', k);
      if (WEAPONS[k].grp) it.cnt = pileSize(k);
      var r = rnd(100);
      if (r < 10) { layCurse(it); it.hp = -(rnd(3) + 1); }
      else if (r < 17) { it.hp = rnd(3) + 1; it.dp = rnd(2); }
      /* A bow asks with 'b' too, so the runes that only make sense on
         something you shoot can be rolled onto one and onto nothing
         else. */
      if (!WEAPONS[k].grp) addRune(it, WEAPONS[k].launch ? 'wb' : 'w', 16);
      break;
    }
    case 'armor': k = weightedPick(ARMORS); it = mkItem('armor', k); enchantGear(it, ARMORS[k]); break;
    case 'head': k = weightedPick(HEADS); it = mkItem('head', k); enchantGear(it, HEADS[k]); break;
    case 'feet': k = weightedPick(FEET); it = mkItem('feet', k); enchantGear(it, FEET[k]); break;
    case 'shield': k = weightedPick(SHIELDS); it = mkItem('shield', k); enchantGear(it, SHIELDS[k]); break;
    case 'ring': {
      /* One of each in a run.  If the set is complete the dungeon has
         nothing left to give here, so it gives a wand instead rather
         than a second ring nobody can tell from the first. */
      var rk = pickUnfoundRing();
      if (rk < 0) { k = weightedPick(WANDS); it = mkItem('wand', k); it.ch = 3 + rnd(8); }
      else it = mkItem('ring', rk);
      break;
    }
  }
  return it;
}

function artic(s) { return ('aeiou'.indexOf(s[0]) >= 0 ? 'an ' : 'a ') + s; }
/* Some things are a pair: boots and sandals are not "a boots". */
function articPl(s, plural) { return plural ? 'a pair of ' + s : artic(s); }
function sgn(n) { return (n >= 0 ? '+' : '') + n; }

function itemName(it) {
  if (!it) return 'nothing';
  var n = it.cnt || 1, s = '';
  switch (it.t) {
    case 'gold': s = it.cnt + ' gold pieces'; break;
    case 'amulet': s = 'the Amulet of Yendor'; break;

  'slow digestion': ['you eat little', 'c'],
  'regeneration': ['wounds close fast', 'c'],
  'searching': ['you spot hidden things', 'c'],
  'add strength': ['strength +2', 'c'],
  'sustain strength': ['strength cannot drop', 'c'],
  'dexterity': ['dexterity +2', 'c'],
  'wisdom': ['wisdom +3', 'c'],
  'aggravate monster': ['you wake monsters!', 'R'],

/* Hunger, as a share of a full stomach.  The clock runs on a scale

function foodPct() { return clamp(Math.round(P.food * 100 / FOOD_MAX), 0, 100); }

/* ------------------------------------------------------------- curses
   Cursing a thing and lifting the curse both go through one door, so a
   named curse cannot be attached in one place and forgotten in another.
   Most cursed things merely refuse to come off; some carry worse. */
function layCurse(it) {
  if (!it) return;
  it.cursed = 1;
  /* Which curse, if any, is not settled here.  Rolling it now would mean
     every cursed thing dropped on a floor pulled a number out of the
     dungeon's own random stream, and the whole floor after it came out
     different - two seeded checks in the suite failed for no reason but
     that.  A curse is not felt until it is worn, so it is not decided
     until then either. */

/* ======================================================= going somewhere
   A click on a square sets off a walk: the cheapest route in turns, not
   in squares.  Water is thigh deep and costs you every second step, so a
   long way round dry ground can be quicker than a short wade - and the
   other way about, which is why it is measured rather than avoided.

   found, a hole, a wall of fire or ice, a barrel of powder.  It cannot
   route round what you have not seen, and it does not pretend to. */

  var tr = trapAtLevel(L, x, y);
  if (tr && tr.found && !tr.spent) return 0;     /* one you can see */
  if (!inWater(x, y)) return STEP_COST;

     so a square of water is worth that much more than a square of
     floor.  Riverborn is at home in it and pays nothing extra. */
  if (hasPerk('riverborn')) return STEP_COST;

/* Dijkstra, since the squares do not all cost the same.  Returns the
   path from where you are to the square asked for, not including the
   square you are standing on, or null if there is no way. */
function findPath(tx, ty, opts) {
  opts = opts || {};
  if (tx === P.x && ty === P.y) return [];
  var n = MAP_W * MAP_H, dist = new Int32Array(n), from = new Int32Array(n), i;
  for (i = 0; i < n; i++) { dist[i] = 2147483647; from[i] = -1; }
  var start = P.y * MAP_W + P.x, goal = ty * MAP_W + tx;
  dist[start] = 0;
  /* a plain binary heap: the floors are small enough that this is
     nothing, and it keeps the walk instant however far you click */
  var heap = [[0, start]];
  function push(d, k) {
    heap.push([d, k]);
    var c = heap.length - 1;
    while (c > 0) {
      var par = (c - 1) >> 1;
      if (heap[par][0] <= heap[c][0]) break;
      var tmp = heap[par]; heap[par] = heap[c]; heap[c] = tmp; c = par;
    }
  }

    var top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      var c = 0;
      for (;;) {
        var l = c * 2 + 1, r = l + 1, s = c;
        if (l < heap.length && heap[l][0] < heap[s][0]) s = l;
        if (r < heap.length && heap[r][0] < heap[s][0]) s = r;
        if (s === c) break;
        var tmp2 = heap[s]; heap[s] = heap[c]; heap[c] = tmp2; c = s;
      }
    }
    return top;
  }
  while (heap.length) {
    var top2 = pop(), d0 = top2[0], k0 = top2[1];
    if (d0 > dist[k0]) continue;
    if (k0 === goal) break;
    var x0 = k0 % MAP_W, y0 = (k0 / MAP_W) | 0, q;
    for (q = 0; q < DIR4.length; q++) {
      var nx = x0 + DIR4[q][0], ny = y0 + DIR4[q][1];
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      var k1 = ny * MAP_W + nx;
      var c1 = stepCost(nx, ny);
      /* Walking up to something rather than onto it does not care
         whether the square itself can be stood on - a locked door is
         asked for exactly so you can go and try the handle. */
      if (!c1) {
        if (!opts.stopShort || k1 !== goal) continue;
        c1 = STEP_COST;
      }
      /* Something standing in the way is in the way - unless it is the
         square you asked for, which is how you walk up to a monster. */
      if (k1 !== goal && monAt(L, nx, ny)) continue;
      if (dist[k0] + c1 < dist[k1]) {
        dist[k1] = dist[k0] + c1;
        from[k1] = k0;

}

  if (L.flags[y * MAP_W + x] & F_SEEN) return 0;
  for (var d = 1; d <= UNSEEN_REACH + 1; d++) {
    for (var dy = -d; dy <= d; dy++) for (var dx = -d; dx <= d; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== d) continue;
      var nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      if (L.flags[ny * MAP_W + nx] & F_SEEN) return d;

  var best = null, bestD = 1e9, i;
  for (i = 0; i < L.tiles.length; i++) {

    var x = i % MAP_W, y = (i / MAP_W) | 0;
    if (!stepCost(x, y)) continue;
    if (monAt(L, x, y)) continue;

    if (d >= bestD) continue;
    if (d && !findPath(x, y, {})) continue;      /* no way to it */
    bestD = d; best = { x: x, y: y };

/* ------------------------------------------------- asking you first

   plain data so the engine can ask it without knowing anything about the
   screen, and the screen can draw it without knowing what it is for. */

}
/* Returns true if the answer costs a turn. */
function answerAsk(yes) {
  var a = G.ask;
  G.ask = null;

/* Water on the skin of somebody who cannot bear it.  One door for all of

/* What a rune is called in the EFFECTS list.

   for "it" to point at, and a line reading "it bites your attacker" is

   whichever of the two this copy is. */

  if (!rn.eff) return rn.txt;

  return rn.eff[it && it.t === 'weapon' ? 'w' : 'g'] || rn.txt;
}
function playerEffects() {
  var out = [], i;
  /* Curses first, before anything else.  The pack shows two of these

  if (G.hungerState === 2) out.push(['weak: no healing', 'O']);
  if (G.hungerState === 3) out.push(['starving: losing hp', 'R']);

  if (P.blind) out.push(['blind (' + P.blind + ')', 'P']);
  if (P.hallu) out.push(['hallucinating', 'P']);
  if (P.haste) out.push(['hasted (' + P.haste + ')', 'c']);
  if (P.frozen) out.push([(P.iced ? 'frozen solid (' : P.webbed ? 'stuck in web (' : 'held fast (') + P.frozen + ')', 'R']);

  if (P.seeinv) out.push(['seeing invisible (' + P.seeinv + ')', 'c']);
  if (P.unseen) out.push(['unseen (' + P.unseen + ')', 'c']);
  if (P.fireShield) out.push(['ringed in fire (' + P.fireShield + ')', 'O']);
  if (P.monsight) out.push(['monster sight (' + P.monsight + ')', 'c']);
  if (P.seer) out.push(['seeing all (' + P.seer + ')', 'P']);
  if (darkAt(P.x, P.y)) out.push([nightEyes() ? 'in the dark, and seeing'
                                              : 'in the dark: one square', nightEyes() ? 'c' : 'p']);
  if (playerRunning()) out.push(['running: you may stumble', 'O']);

     rest, so the half that said what the red hands are for was the half
     that fell off the bottom. */

  if (P.amulet) out.push(['carrying the Amulet', 'y']);

  var pk = perkList();
  /* One line each: the panel has very little room to spare, so the name
     and what it does share a line and the short wording exists to make
     that fit. */
  for (i = 0; i < pk.length; i++)
    out.push([pk[i].n + ': ' + (pk[i].s || pk[i].txt), 'G']);

  for (i = 0; i < eq.length; i++) {

    var rn = activeRune(eq[i]);
    if (rn) out.push([runeEffect(eq[i], rn), rn.bad ? 'R' : 'c']);

    if (eq[i].protected) out.push(['armor is protected', 'c']);
  }
  for (i = 0; i < eq.length; i++)
    if (eq[i].cursed) out.push(['cursed: ' + shortItem(eq[i]), 'R']);

}
function shortItem(it) {
  var d = itemDef(it);

}

/* ------------------------------------------------------ looking about

  var f = L.flags[j];

  var lit = !!(f & F_VIS);

    out.push(cap(monName(m)) + (m.ally ? ' (yours)' : ''));
    var mi = MON_INFO[m.c];
    if (m.disguise) out.push('It looks like a chest.');
    else if (mi) for (i = 0; i < mi.length; i++) out.push(mi[i]);
    out.push(m.state === 0 ? 'It is fast asleep.' :
             m.state === 1 ? 'It has not noticed you.' : 'It is hunting you.');
    if (m.burn) out.push('It is on fire.');
    if (dazzled(m)) out.push('The light has it reeling.');
    if (m.doused > 0) out.push('It is too wet to breathe fire.');
    if (m.blind) out.push('It has been blinded.');
    if (m.slowed) out.push('It is moving slowly.');

    if (!m.flee && m.hp * 4 < m.mhp && rnd(100) < 30) m.flee = FLEE_TURNS + rnd(FLEE_TURNS);
  } else {
    sound('miss');
    msgFight(fightLine('You miss ', name, '.'), 'g', 'miss', '6', m);
  }
}
/* Setting something alight, and freezing it solid.  A sword of fire, a
   burning stone and anything else that catches all end up here, so they
   burn for the same length of time and leave the same trail. */
function igniteMon(m, line) {
  if (m.def.sp === 'flame') {              /* it is made of the stuff */
    if (canSeeMon(m)) msgFight('The flames wash over it.', '6', 'unburnt', '6', m);
    return 0;
  }
  /* Standing in the water is the one place nothing catches. */
  if (inWater(m.x, m.y)) {
    if (canSeeMon(m)) msgFight('The water keeps it from catching.', 'c', 'wet', 'c', m);
    return 0;
  }
  var turns = BURN_MIN + rnd(BURN_MAX - BURN_MIN + 1);
  m.burn = Math.max(m.burn || 0, turns);
  hurtByPlayer(m);
  msgFight(line || 'It catches fire.', 'R', 'alight', 'R', m);
  return turns;
}
function freezeMon(m, line) {
  var turns = ICE_MIN + rnd(ICE_MAX - ICE_MIN + 1);
  m.stuck = (m.stuck || 0) + turns;
  hurtByPlayer(m);
  msgFight(line || 'It freezes solid.', 'c', 'frozen ' + turns, 'c', m);
  return turns;
}
/* One turn of burning: the damage, and the countdown.  Returns true if
   the fire finished it, in which case the caller must stop touching it. */
function burnTick(m) {
  if (!m.burn) return false;
  /* Into the water and it is out.  Walking into a pool is the obvious
     thing to do when you are alight, and it ought to work. */
  if (inWater(m.x, m.y)) {
    m.burn = 0;
    if (canSeeMon(m)) msgFight(fightLine('', cap(monShort(m)), ' steps into the water.'),
      'c', 'out', 'c', m);
    return false;
  }
  m.burn--;
  var d = roll(BURN_DAMAGE[0], BURN_DAMAGE[1]);
  m.hp -= d;
  markHurt(m, m.x, m.y + 1);
  if (m.hp <= 0) { killMonster(m, true, d + ' burn'); return true; }
  msgFight(fightLine('', cap(monShort(m)), ' is burning.'), 'R', d + ' burn', 'R', m);
  return false;
}

/* What the rune in your right hand does to whatever you just hit.
   Returns true if the monster died here. */
function runeStrike(m) {
  var r = weaponRune();
  if (!r) return false;
  var d;
  switch (r.n) {
    case 'fire':
      if (rnd(100) < BURN_CHANCE) igniteMon(m, 'The blade sets it alight.');
      break;
    case 'ice':
      if (rnd(100) < ICE_CHANCE) freezeMon(m, 'Ice sheathes it.');
      break;
    case 'venom':
      if (rnd(100) < 35) {
        m.ar = Math.min(10, m.ar + 1);
        d = roll(1, 3); m.hp -= d;
        msgFight('Venom runs into the wound.', 'g', d + ' venom', 'g', m);
      }
      break;
    case 'leeching':
      if (P.hp < P.mhp) {
        P.hp = Math.min(P.mhp, P.hp + 1);
        msgFight('The blade drinks.', 'r', 'you heal 1', 'G', m);
      }
      break;
    case 'discord':
      if (rnd(100) < 22 && !m.disc) {
        m.disc = DISCORD_TURNS;
        msgFight('A sour note hangs in the air.', 'P', 'marked', 'P', m);
      }
      break;
    case 'quickness':
      if (rnd(100) < 20 && m.hp > 0) {
        d = damRoll([WEAPONS[P.eq.rh.k].d]) + playerDamBonus();
        if (d < 1) d = 1;
        m.hp -= d;
        msgFight('You strike again in the same breath.', 'y', d + ' damage', 'O', m);
      }
      break;
  }
  if (m.hp <= 0) { killMonster(m, true, 'slain'); return true; }
  return false;
}

function killMonster(m, byPlayer, fx, delay) {
  var i = L.mons.indexOf(m);
  if (i >= 0) L.mons.splice(i, 1);
  if (P.heldBy === m) { P.held = 0; P.heldBy = null; }
  /* it stays on screen, blinking, so you see what your arrow hit */
  L.corpses.push({
    spr: m.disguise ? 'chest' : 'mon_' + m.c, x: m.x, y: m.y,
    t: beatNow() + (delay || 0), ally: m.ally
  });
  if (byPlayer) {
    m.hp = 0;
    sound('kill');                 /* four notes over the fallen */
    msgFight(fightLine('You slay ', monShort(m), '.'), 'G', fx || 'slain', 'y', m);
    P.exp += m.xp + (m.lv > 1 ? ((m.lv - 1) * m.xp / 10) | 0 : 0);
    checkLevelUp();
  }
  if (m.gold > 0) { var g = mkItem('gold', 0); g.cnt = m.gold; dropNear(m.x, m.y, g); }
  /* A leprechaun keeps more than coin about him, and now and then the
     one ring in the game that nobody leaves lying on a floor. */
  /* He already carries something better than half the time - that is
     what makes him worth chasing - so this only adds the ring on top,
     rather than a second helping of loot. */
  /* Her spider going down is what she waits on before calling another. */
  if (m.petOf) {
    for (var wi2 = 0; wi2 < L.mons.length; wi2++)
      if (L.mons[wi2].uid === m.petOf) L.mons[wi2].spiderIn = WITCH_SPIDER_WAIT + 1;
  }
  /* And the ring off her own finger.  Like the leprechaun's, it is the
     only way that one ever turns up. */
  if (m.def.sp === 'witch' && byPlayer && rnd(100) < WITCH_RING_PCT) {
    var wi = ringIndex('the witch');
    if (wi >= 0) {
      dropNear(m.x, m.y, mkItem('ring', wi));
      msg('A ring slips from her hand.', 'P');
    }
  }
  if (m.def.sp === 'stealgold' && byPlayer && rnd(100) < LEP_RING_PCT) {
    var ri = ringIndex('the unseen');
    if (ri >= 0) {
      dropNear(m.x, m.y, mkItem('ring', ri));
      msg('Something small rolls free of his fingers.', 'P');
    }
  }
  if (m.item) dropNear(m.x, m.y, m.item);
}
function checkLevelUp() {
  while (P.lv < 21 && E_LEVELS[P.lv - 1] && P.exp >= E_LEVELS[P.lv - 1]) {
    P.lv++;
    var add = roll(1, LEVEL_HP_DIE) + LEVEL_HP_FLAT;
    P.mhp += add; P.hp += add;
    msg('Welcome to level ' + P.lv + '!', 'c');
    /* Some levels come of age.  Queue the choice rather than making it
       here: this can happen in the middle of resolving a blow, and the
       screen has to wait until the turn has finished playing out. */
    if (perkLevel(P.lv) && !G.perkPick) {
      var offer = perkOffer();
      G.perkPick = { lv: P.lv, offer: offer, i: 0, at: beatNow() + PERK_PAUSE };
    }
  }
}

/* Is the fighting over, and has the dust settled?

   A level comes of age on the blow that kills something, and the screen
   used to open on that instant - over the corpse still blinking, with
   the killing line not yet printed and whatever else was in the room
   still coming for you.  It waits now: nothing hostile in sight, and a
   moment after the last blow. */
function perkReady() {
  var job = G.perkPick;
  if (!job) return false;
  if (Date.now() < (job.at || 0)) return false;
  if (battleFoes().length) return false;
  return true;
}

/* what the choice does, whichever way it goes */
function takeLevelReward(which) {
  var job = G.perkPick;
  if (!job) return false;
  G.perkPick = null;
  if (which === 'hp' || !job.offer.length) {
    P.mhp += PERK_HP; P.hp += PERK_HP;
    msg('You are hardier for it. +' + PERK_HP + ' max hp.', 'G');
    return true;
  }
  return takePerk(which);
}
/* Which way to flinch: directly away from whatever did it.  A shot from
   an angle knocks you back on the diagonal. */
/* Which way is "away from there", as one of the eight directions, with
   a diagonal only when the angle really is diagonal. */
function shoveDir(dx, dy) {
  var ax = Math.abs(dx), ay = Math.abs(dy);
  if (!ax && !ay) return { dx: 0, dy: 1 };
  return {
    dx: (ax && ax * 2 >= ay) ? (dx > 0 ? 1 : -1) : 0,
    dy: (ay && ay * 2 >= ax) ? (dy > 0 ? 1 : -1) : 0

}
/* scale damage without the rounding swallowing it */
function softenDamage(dm, mul) {
  var v = dm * mul, fl = Math.floor(v);
  if (rnd(1000) < Math.round((v - fl) * 1000)) fl++;
  return Math.max(1, fl);
}

function markHurt(ent, sx, sy) {
  if (!ent) return;
  var d = shoveDir(ent.x - sx, ent.y - sy);
  ent.hurt = { t: beatNow(), dx: d.dx, dy: d.dy };
  /* one place for the sound of a landed blow, so nothing that hurts
     anybody can forget to make a noise */
  if (ent === P || canSeeMon(ent)) sound('hurt');
}
/* The other half of a blow: whoever is swinging leans into it. */
function markLunge(ent, tx, ty) {
  if (!ent) return;
  var d = shoveDir(tx - ent.x, ty - ent.y);
  ent.lunge = { t: beatNow(), dx: d.dx, dy: d.dy };
}
function hurtAt(ent, delay, sx, sy) {
  markHurt(ent, sx, sy);
  if (delay) ent.hurt.t += delay;
}

/* ------------------------------------------------------ the health bar
   A turn is worked out in one go, so by the time the blow that took four
   points off you is drawn and heard, your health has been sitting four
   points lower for most of a second.  The number people watch is the
   meter, and it was running ahead of the fight.

   So every change to it is stamped with the moment it belongs to, and
   the meter shows the last one that has actually arrived. */
/* Hold the old reading until the blow that changed it has landed.  Each
   entry says "show this until then", so a change nobody stamped simply
   appears at once - the meter can never get stuck on a stale number. */
function holdHp(hp, mhp) {
  var at = beatNow();
  if (at <= Date.now()) return;          /* nothing to wait for */
  if (!G.hpq) G.hpq = [];
  G.hpq.push({ at: at, hp: hp, mhp: mhp });
  if (G.hpq.length > 40) G.hpq.splice(0, G.hpq.length - 40);
}
/* what the meter should read this instant */
function shownHp() {
  var q = G.hpq, now = Date.now(), i;
  if (!q || !q.length) return { hp: P.hp, mhp: P.mhp };
  for (i = 0; i < q.length; i++) if (q[i].at > now) break;
  if (i > 0) q.splice(0, i);             /* those moments have passed */
  if (!q.length) return { hp: P.hp, mhp: P.mhp };
  return { hp: q[0].hp, mhp: q[0].mhp };
}
/* bring the meter up to date at once - for a screen that must not lie */
function settleHp() { if (G.hpq) G.hpq.length = 0; }

/* Ember skin, Frostborn and Ironblood all do the same thing to a

var PERK_FOR_KIND = { fire: 'ember', cold: 'frost', poison: 'ironblood' };
