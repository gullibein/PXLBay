  /* A flask is thrown at a square, not at a target, so it can be lobbed
     to an ally as easily as at a foe - which is the only way to get a
     healing mist onto somebody fighting for you.  A vial is the same
     kind of throw: what matters is the square it breaks on, not what
     happens to be standing there. */
  if (victim && !isFlask(it) && !vial && !boom) {
    if (victim.ally) { msg('You will not shoot your own.', '6'); return false; }
    return fireAt(victim);                    /* a stone finds its mark */
  }

  var flight = 80 + Math.round(Math.max(Math.abs(tx - P.x),
    Math.abs(ty - P.y)) * 20);
  sound('shoot');
  G.shot = { sx: P.x, sy: P.y, ex: tx, ey: ty, t: beatNow(),
             dur: flight, tail: 4,
             /* what the thing looks like, not what it is: a runed
                stone wears whichever carving this run dealt it, and it
                must wear the same one in the air */
             spr: (it.t === 'weapon') ? itemSprite(it) : null,
             col: boom ? '#d82b2b' : vial ? vialColour(it)
                  : isFlask(it) ? '#f59e0b' : null };
  beatWait(flight);
  removeItem(it, 1);

  if (boom) { dynamiteAt(tx, ty); return true; }

  /* A flagstone you are suspicious of is worth a stone.  Whatever lands
     on a trap sets it off, from wherever you are standing. */
  var hitTrap = trapAtLevel(L, tx, ty);
  if (hitTrap && !hitTrap.spent) springFromAfar(hitTrap);

  /* a vial breaks wherever it lands, and what it does it does to the
     room rather than to whatever it hit */
  if (vial) return breakVial(it, tx, ty, victim);

  if (!isFlask(it)) {
    /* thrown at open floor, it simply lands there - unless it is charmed
       to come back, or runed to do something first */
    if (WEAPONS[it.k].rune) {
      msg(cap(WEAPONS[it.k].n) + ' clatters to the ground.', '6');
      var runeChg = it.chg || 0;
      stoneRune(WEAPONS[it.k].rune, { x: tx, y: ty }, it, flight);
      /* and the same chance of coming through it as a stone thrown at
         something: the rune is not always spent by going off once */
      if (WEAPONS[it.k].rune !== 'return' && (runeChg > 0 || rnd(100) < runeKeepPct()))
        keepRuneStone(it, tx, ty, runeChg > 0 ? runeChg - 1 : 0);
    } else if (!flyHome(it, tx, ty, flight)) {
      /* the same rule as a throw at something: one flight, one roll */
      var wear2 = hurlWear(it);
      if (wear2) hurlSays(it, wear2);
      else msg(cap(WEAPONS[it.k].n) + ' clatters to the ground.', '6');
      if (wear2 !== 2) dropNear(tx, ty, likeItem(it));
    }
    return true;
  }

  /* a flask breaks wherever it lands */
  splashDrops(tx, ty, potionColour(it));
  if (victim) hurtByPlayer(victim);
  var what = flaskEffect(it);
  msg('The flask shatters' + (victim ? ' on ' + monShort(victim) : '') + '.', 'O');
  if (what) KNOWN.pot[it.k] = 1;      /* you saw what it did */
  if (what === 'fire') {
    var n = spawnFire(tx, ty);
    msg('Fire spreads across ' + n + ' square' + (n > 1 ? 's' : '') + '.', 'R');
    burnEverything();
  } else if (what === 'slime') {
    var sn = slimeSplash(tx, ty);
    msg('The flask bursts into a slick of slime across ' + sn +
      ' square' + (sn > 1 ? 's' : '') + '.', 'G');
  } else if (what === 'gas') {
    spawnCloud(tx, ty, 'poison', GAS_TURNS_MIN + rnd(GAS_TURNS_MAX - GAS_TURNS_MIN + 1),
      beatNow());
    msg('Green vapour billows out.', 'g');
  } else if (what === 'mend') {
    /* The same vapour, the other way about: it mends whatever stands in
       it, you and your allies included, and it hangs about the same
       handful of turns. */
    spawnCloud(tx, ty, 'mend', GAS_TURNS_MIN + rnd(GAS_TURNS_MAX - GAS_TURNS_MIN + 1),
      beatNow());
    msg('A red mist rolls out of the shards.', 'r');
  } else if (what === 'blind') {
    if (victim) {
      victim.blind = (victim.blind || 0) + rnd(8) + 8;
      victim.state = 2; victim.disguise = 0;
      msgFight(fightLine('The dark splashes over ', monShort(victim), '.'),
        'p', 'blinded', 'p', victim);
    } else msg('The dark soaks away into the stone.', '6');
  } else if (what === 'water' || what === 'holy') {
    var blessed = what === 'holy';
    /* thrown at your own feet, or near enough to break over them */
    if (tx === P.x && ty === P.y) soakPlayer('The water burns you.');
    /* and the water itself goes on the floor and lies there */
    var pud = spillWater(tx, ty, blessed);
    if (victim) {
      /* Water puts a fire breather out.  It is not damage - it is the
         difference between being shot at from across the room and not. */
      if (victim.def.sp === 'fireball') {
        victim.doused = DOUSED_TURNS;
        victim.state = 2; victim.disguise = 0;
        msgFight(fightLine('Water runs over ', monShort(victim), '.'),
          'c', 'doused', 'c', victim);
      }
      if (blessed && (victim.def.sp === 'drainmax' || victim.def.sp === 'drainexp')) {
        var hd = roll(HOLY_WATER_DAMAGE[0], HOLY_WATER_DAMAGE[1]);
        victim.hp -= hd; victim.state = 2; victim.disguise = 0;
        markHurt(victim, P.x, P.y);
        if (victim.hp <= 0) killMonster(victim, true, hd + ' holy');
        else msgFight(fightLine('It scalds ', monShort(victim), ' to the bone.'),
          'y', hd + ' holy', 'y', victim);
      } else if (victim.def.sp !== 'fireball') {
        msgFight(fightLine('', cap(monShort(victim)), ' is merely wet.'), '6', 'wet', '6', victim);
      }
    } else if (pud) {
      msg((blessed ? 'Blessed water' : 'Water') + ' spreads across ' +
        (pud > 1 ? pud + ' squares' : 'the floor') + '.', 'c');
    } else msg(blessed ? 'The blessing soaks away into the stone.'
                       : 'The water soaks away into the stone.', '6');
  } else if (what === 'daze') {
    if (victim) {
      victim.conf = (victim.conf || 0) + rnd(8) + 8;
      victim.state = 2; victim.disguise = 0;
      msgFight(fightLine('', cap(monShort(victim)), ' reels, wide eyed.'),
        'P', 'confused', 'P', victim);
    } else msg('The fumes drift away.', '6');
  } else if (what === 'strong') {
    if (victim) {
      victim.dmgBonus = (victim.dmgBonus || 0) + POTION_STRONG_DAM;
      victim.state = 2; victim.disguise = 0;
      msgFight(fightLine('', cap(monShort(victim)), ' swells with strength!'),
        'R', 'stronger', 'R', victim);
    } else msg('The draught soaks away into the stone.', '6');
  } else {
    msg('Nothing much happens.', '6');
  }
  return true;
}

/* how many of a stack are left, or 0 if it has gone */
function countOf(it) {
  var all = carriedItems();
  for (var i = 0; i < all.length; i++) if (all[i] === it) return it.cnt;
  return 0;
}

/* The thing that lands on the floor, or flies back to you: the same
   weapon, with everything about it that mattered carried over.  Four
   places used to build this by hand and the charm would have been
   dropped by the first one that forgot. */
/* How often a runed stone comes through a throw with its rune still on
   it.  The same things that get your arrows back get your stones back. */
function runeKeepPct() {
  var p = RUNE_RECOVER_PCT;
  if (carryingRing('battle luck')) p = Math.max(p, LUCK_RECOVER_PCT);
  if (hasPerk('scavenger')) p = 100 - (100 - p) / 2;
  return p;
}
/* Put it back on the floor where it fell, carving and all - or in your
   pack if there is nowhere clear to put it down, which is better than
   quietly losing it. */
function keepRuneStone(am, x, y, chg) {
  var again = mkItem('weapon', am.k);
  again.cnt = 1; again.hp = am.hp; again.dp = am.dp;
  again.known = am.known; again.chg = chg || 0;
  if (am.homing) again.homing = 1;
  /* A stone that counts its flights home carries the count with it.  A
     fresh one starts at RETURN_USES, so handing the player a new item
     here would wind a spent stone back up to full - which is a stone
     that never runs out, by way of surviving a throw. */
  if (am.ret !== undefined) again.ret = am.ret;
  if (!dropNear(x, y, again) && !addItem(again)) dropNear(P.x, P.y, again);
  return again;
}
function likeItem(am) {
  var c = mkItem('weapon', am.k);
  c.cnt = 1; c.hp = am.hp; c.dp = am.dp; c.known = am.known;
  /* the workmanship travels with it - a worn spear that has landed is
     still a worn spear when you pick it up again */
  if (am.make) c.make = am.make;
  if (am.homing) c.homing = 1;
  if (am.ret !== undefined) c.ret = am.ret;
  return c;
}
/* What a landing did to a hurled weapon, said in the log.  Nothing at
   all for an ordinary flight - it is only worth a line when the thing
   has changed. */
function hurlSays(it, wear) {
  if (wear === 2) msg(cap(WEAPONS[it.k].n) + ' breaks apart where it falls.', 'O');
  else if (wear === 1) msg(cap(WEAPONS[it.k].n) + ' holds, but it is worn now.', '6');
}
/* The scroll of return brings it home rather than leaving it where it
   fell.  Returns true if it handled the landing. */
function flyHome(am, fx, fy, flight) {
  if (!am.homing) return false;
  G.ret = { fx: fx, fy: fy, tx: P.x, ty: P.y,
            t: beatNow(), dur: RETURN_MS, spr: itemSprite(am) };
  beatWait(RETURN_MS);
  var back = likeItem(am);
  if (addItem(back)) msg(cap(WEAPONS[am.k].n) + ' flies back to your hand.', 'G');
  else { dropNear(P.x, P.y, back); msg('It returns, and you fumble it.', 'O'); }
  return true;
}

/* Web from a bow: it flies like a shot, it holds like a web, and the
   quiver is untouched. */
function looseWeb(best, lw) {
  var gap = Math.max(Math.abs(best.x - P.x), Math.abs(best.y - P.y));
  var flight = 90 + gap * 22;
  sound('shoot');
  G.shot = { sx: P.x, sy: P.y, ex: best.x, ey: best.y, t: beatNow(), dur: flight,
             col: '#c3ccd9', tail: 4 };
  beatWait(flight);
  var hold = SPIDER_BOW_HOLD[0] + rnd(SPIDER_BOW_HOLD[1] - SPIDER_BOW_HOLD[0] + 1);
  best.stuck = (best.stuck || 0) + hold;
  best.webbed = (best.webbed || 0) + hold;
  best.state = 2; best.disguise = 0;
  markHurt(best, P.x, P.y);
  msgFight(fightLine('Web wraps ', monShort(best), '.'), 'c', 'stuck ' + hold, 'O', best);
  lw.known = 1;                      /* you have just watched it work */
  computeVis();
  return true;
}

function fireAt(best) {
  var kit = canShoot();
  if (!kit || !best) return false;
  breakClearwater('You give yourself away.');
  var lw = kit.bow, am = kit.ammo, W = kit.def;

  var sneak = surpriseHit(best), extra = surpriseDam(best);
  var unaware = best.state < 2, name = monShort(best);
  var ammoName = cap(WEAPONS[am.k].n);
  var landed = null;                  /* where it came down, if it missed */
  hurtByPlayer(best);
  /* A bow of the spider now and then looses web rather than a shaft.  It
     costs no arrow, does no damage, and sticks what it hits where it
     stands - which is worth more than the arrow would have been. */
  if (!kit.thrown && lw && activeRune(lw) && activeRune(lw).n === 'the spider' &&
      rnd(100) < SPIDER_BOW_PCT) {
    return looseWeb(best, lw);
  }
  /* A charged runestone survives being thrown, but it still leaves your
     hand: it lands where it fell, one charge poorer, and waits to be
     picked up.  Spending the charge in place would leave you holding it
     and lying on the floor at the same time. */
  var chargedRune = isRuneStone(am) && am.chg > 0;
  var keepChg = chargedRune ? am.chg - 1 : 0;
  var wasCharged = am.chg || 0;
  /* A returning stone is not spent by being thrown - it comes back.  It
     stays in the pack and its flights are counted down in place, so a
     stack of three is three stones used one after another rather than
     three stones sharing one tally between them. */
  var homer = isRuneStone(am) && WEAPONS[am.k].rune === 'return';
  if (homer) { /* stoneRune counts it down when it lands */ }
  else if (isRuneStone(am)) removeItem(am, 1);
  else spendUse(am);

  var thrown = !!kit.thrown;
  /* A bow of fire lights the shaft as it leaves the string.  What it
     hits catches; what it comes down on catches; and it is the bow that
     does it, so an arrow out of any other bow is only an arrow. */
  var aflame = !thrown && lw && activeRune(lw) && activeRune(lw).n === 'fire';
  /* A crossbow sends it flatter and faster than a bow does.  They share
     the same arrows now, so it is the launcher that decides, not what is
     loaded into it. */
  var isBolt = !thrown && lw && WEAPONS[lw.k].n === 'crossbow';
  var flight = (isBolt ? 70 : 90) +
    Math.round(Math.max(Math.abs(best.x - P.x), Math.abs(best.y - P.y)) * (isBolt ? 17 : 22));
  sound('shoot');
  /* An arrow is a streak; a stone or a spear is a thing, and it should
     look like the thing on the way out as well as on the way home.
     Watching an arrow fly off and a runestone come back was the same
     object wearing two faces. */
  /* Stamped on the same clock as everything else in the turn.  It used
     to start flying the instant the key was pressed while the blow it
     lands was timed properly, so with anything else already queued the
     stone arrived before it had been thrown. */
  G.shot = { sx: P.x, sy: P.y, ex: best.x, ey: best.y, t: beatNow(), dur: flight,
             tail: isBolt ? 3 : 6,
             spr: thrown ? itemSprite(am) : null };

  /* everything waits for the arrow to arrive */
  beatWait(flight);

  /* One throw, one roll.  Whether the shaft comes through this flight is
     settled before we know whether it hit, so a hit, a miss and a lob at
     bare floor all wear it the same - it is being thrown that breaks a
     spear, not what it happens to land on. */
  var wear = hurlWear(am);

  /* Too close to draw properly: one square away is the worst of it, and
     it eases off with every step of room you have. */
  var gap = Math.max(Math.abs(best.x - P.x), Math.abs(best.y - P.y));
  var crowded = gap < POINT_BLANK ? (POINT_BLANK - gap) * POINT_BLANK_PENALTY : 0;
  if (swingP(P.lv, best.ar,
             playerHitBonus() + (thrown ? 0 : lw.hp) + am.hp + sneak - crowded)) {
    /* A spear or a throwing dagger is the same weapon whether it is in
       your hand or in the air, so it rolls its own dice and nothing
       else.  Everything shot from a bow adds the bow's. */
    var dice = W.shot ? [WEAPONS[am.k].d, W.shot] : [WEAPONS[am.k].d];
    var dmg = Math.max(1, (hasPerk('marksman') ? PERK_SHOT_DAM : 0) +
      damRoll(dice) + addDam(effStr()) +
      (thrown ? 0 : lw.dp) + am.dp + extra);
    best.hp -= dmg;
    markHurt(best, P.x, P.y);            /* the clock already holds the flight */
    var fx = dmg + (extra ? ' sneak' : ' damage');
    /* Now and then the shaft comes through intact - and a stone that has
       been charged is half as likely to be lost as one that has not. */
    var keepPct = isStoneAmmo(am) ? STONE_RECOVER_PCT : ARROW_RECOVER_PCT;
    /* a ring of battle luck: what you loose, you mostly get back */
    if (carryingRing('battle luck')) keepPct = Math.max(keepPct, LUCK_RECOVER_PCT);
    if (wasCharged && isPlainAmmo(am)) keepPct = 100 - (100 - keepPct) / 2;
    /* a scavenger picks his shafts back out of the wall */
    if (hasPerk('scavenger')) keepPct = 100 - (100 - keepPct) / 2;
    /* A spear is not lost in the wall the way a shaft is: if it came
       through the throw at all it is lying there to be picked up.  What
       can take it is the throw itself - see hurlWear above. */
    if (isHurlWeapon(am)) keepPct = (wear === 2 ? 0 : 100);
    if (!W.rune && !flyHome(am, best.x, best.y, flight)) {
      hurlSays(am, wear);
      if (rnd(100) < keepPct) dropNear(best.x, best.y, likeItem(am));
    }
    if (aflame) {
      /* the square first: it burns whether or not the shot killed it */
      var bx0 = best.x, by0 = best.y;
      if (best.hp <= 0) { killMonster(best, true, fx, flight); dropEmber(bx0, by0); return true; }
      igniteMon(best, 'The burning shaft sets it alight.');
      dropEmber(bx0, by0);
      if (best.hp <= 0) { killMonster(best, true, 'burnt', flight); return true; }
    }
    if (best.hp <= 0) { killMonster(best, true, fx, flight); return true; }
    msgFight(fightLine(ammoName + ' hits ', name, '.'), 'y', fx, 'O', best);
    if (!best.flee && best.hp * 4 < best.mhp && rnd(100) < 30) best.flee = 1;
  } else {
    msgFight(fightLine(ammoName + ' misses ', name, '.'), '6', 'miss', '6', best);
    /* it sails on past and clatters down somewhere behind */
    var vx = best.x - P.x, vy = best.y - P.y;
    var len = Math.sqrt(vx * vx + vy * vy) || 1;
    var fx = best.x, fy = best.y;
    var over = 1 + rnd(ARROW_OVERSHOOT);
    for (var st = 1; st <= over; st++) {
      var nx2 = Math.round(best.x + (vx / len) * st), ny2 = Math.round(best.y + (vy / len) * st);
      if (blocksShot(nx2, ny2)) break;
      fx = nx2; fy = ny2;
    }
    /* not `extra` - that is the sneak damage, and var is not block
       scoped, so reusing the name here quietly emptied it */
    var sail = 30 * (Math.abs(fx - best.x) + Math.abs(fy - best.y));
    G.shot.ex = fx; G.shot.ey = fy;
    G.shot.dur = flight + sail;
    /* It is still in the air.  Anything that happens where it comes down
       - a rune going off, a charmed stone turning round - has to wait for
       it to get there, or the same stone is on the screen twice: one
       sailing on past and one already flying home. */
    beatWait(sail);
    landed = { x: fx, y: fy };
    if (aflame) dropEmber(fx, fy);
    if (W.rune !== 'return' && !flyHome(am, fx, fy, flight)) {
      hurlSays(am, wear);
      if (wear !== 2) dropNear(fx, fy, likeItem(am));
    }
  }
  /* and it comes home from where it landed, not from what it missed */
  if (W.rune) stoneRune(W.rune, landed || best, am, flight);
  /* It kept its charge, so it is still a stone: it should be there to
     pick up again.  If there is nowhere clear to put it down - a corner
     already piled with things - it goes back in your pack rather than
     being quietly lost, which is the whole point of charging it. */
  /* Charged, it always survives; uncharged, it survives about a quarter
     of the time - a rune cut into stone is not always used up by one
     throw, and a stone you can go and pick up again is worth carrying. */
  if (W.rune && W.rune !== 'return' && (chargedRune || rnd(100) < runeKeepPct())) {
    var where = landed || best;
    keepRuneStone(am, where.x, where.y, chargedRune ? keepChg : 0);
  }
  return true;
}

/* ------------------------------------------------------- runed stones
   Whatever the stone was cut for happens where it lands. */
function stoneRune(rune, target, am, flight) {
  var i;
  /* You have just watched it do the thing it was cut for.  Whatever else
     is a mystery about it, what kind of stone it is no longer is - so it
     names itself, and so does every other one like it in your pack.
     Only the returning stone used to do this, which left the blasting,
     binding, burning and freezing stones reading "a stone with strange
     letters" for the whole run however often you threw one. */
  if (am && am.t === 'weapon') { am.known = 1; learnWeapon(am.k); }
  /* A rune cut by somebody else still needs a hand that magic will
     answer.  In a squib's it is a stone, and it lands like one. */
  if (squibbed('rune')) return;
  if (target && L.mons.indexOf(target) >= 0) hurtByPlayer(target);
  switch (rune) {
    case 'blast': {
      /* Everything beside the impact, the target included - but a blast
         fills a room, it does not fill the stone around it.  A square you
         could not walk onto is not part of it, and neither is one with a
         wall standing in front of it: it used to be drawn as a flat
         square of fire whatever it was drawn over, and it caught things
         through walls. */
      var cells = [], hit = [], dx, dy;
      for (dy = -BLAST_RANGE; dy <= BLAST_RANGE; dy++)
        for (dx = -BLAST_RANGE; dx <= BLAST_RANGE; dx++) {
          var bx = target.x + dx, by = target.y + dy;
          if (!walkable(bx, by)) continue;
          if (!shotClear(target.x, target.y, bx, by)) continue;
          cells.push([bx, by]);
          var m2 = monAt(L, bx, by);
          if (m2 && hit.indexOf(m2) < 0) hit.push(m2);
        }
      G.splash = { cells: cells.slice(), t: beatNow(), kind: 'blast' };
      sound('boom');
      /* and it leaves the squares it filled burning, which takes the
         furniture and sets off any powder standing in them */
      scorch(cells, 0, beatNow());
      msgTrap('The stone bursts!', 'O', hit.length + ' caught', 'O');
      for (i = 0; i < hit.length; i++) {
        var bm = hit[i], bd = roll(BLAST_DAMAGE[0], BLAST_DAMAGE[1]);
        bm.hp -= bd; bm.state = 2; bm.disguise = 0;
        markHurt(bm, target.x, target.y);
        if (bm.hp <= 0) killMonster(bm, true, bd + ' blast');
        else msgFight(fightLine('', cap(monShort(bm)), ' is caught.'), 'O', bd + ' blast', 'O', bm);
      }
      break;
    }
    /* A stone of fire, and a stone of ice.  Both hit like a plain stone
       and then do the thing they are cut for - to whatever they land on,
       friend or foe, since a stone cannot tell. */
    case 'fire':
      if (L.mons.indexOf(target) >= 0) igniteMon(target, 'The stone bursts into flame.');
      else { dropEmber(target.x, target.y); msg('The stone flares where it lands.', 'O'); }
      break;
    case 'ice':
      if (L.mons.indexOf(target) >= 0) {
        freezeMon(target, 'The stone bursts into frost.');
        /* and if the cold is the very thing it cannot stand, it bites */
        if (target.def.weak === 'cold') {
          var cd = elemDamage(target, roll(RING_BEAM[0], RING_BEAM[1]), 'cold');
          target.hp -= cd;
          markHurt(target, target.x, target.y + 1);
          if (target.hp <= 0) killMonster(target, true, cd + ' cold');
          else msgFight(fightLine('The cold goes through ', monShort(target), '.'),
            'c', cd + ' cold', 'c', target);
        }
      } else msg('Frost spreads where the stone lands.', 'c');
      break;
    /* A stone with a current in it.  Where it lands it jolts whatever is
       standing there; landed in water, the water carries it to everything
       standing in the same pool - which is why it is worth aiming at the
       shallows rather than at the creature. */
    case 'shock': {
      var at = target && target.x !== undefined ? target : { x: P.x, y: P.y };
      var cells = shockCells(at.x, at.y);
      var wet = cells.length > 1;
      var got = shockSquares(cells, 'a shocking stone');
      msgTrap(wet ? 'The water crackles with current!' : 'The stone cracks and sparks.',
        'c', got ? got + ' caught' : 'nothing caught', got ? 'c' : '6');
      break;
    }
    case 'slow':
      if (L.mons.indexOf(target) >= 0) {
        target.slowed = STONE_SLOW_TURNS;
        msgFight(fightLine('Bindings coil round ', monShort(target), '.'),
          'c', 'slowed', 'c', target);
      }
      break;
    case 'return': {
      /* The rune is not endless: it will bring the stone home a set
         number of times, and after that it is a stone like any other.

         The count belongs to the stone in the air, not to the pile it
         came from.  It is spent in place, so the first of a stack is
         worn out before the second is touched. */
      var left = (am.ret === undefined ? RETURN_USES : am.ret) - 1;
      G.ret = { fx: target.x, fy: target.y, tx: P.x, ty: P.y,
                t: beatNow(), dur: RETURN_MS, spr: itemSprite(am) };
      beatWait(RETURN_MS);
      /* You have just watched it come back to your hand.  Whatever else
         it may be carrying, there is no longer any question about what
         kind of stone it is - so it names itself, and so does every
         other one like it you happen to be carrying. */
      am.known = 1;
      learnWeapon(am.k);
      if (left > 0) {
        am.ret = left;
        msg('The stone flies back to your hand.' +
            (left <= 3 ? ' The marks are faint now.' : ''), 'G');
        break;
      }
      /* The last flight of this one.  It comes home as an ordinary
         stone, and the next of the stack starts fresh. */
      removeItem(am, 1);
      if (countOf(am) > 0) am.ret = undefined;
      var plain = mkItem('weapon', weaponIndex('stone'));
      plain.cnt = 1; plain.known = 1;
      if (addItem(plain)) msg('The stone returns, and the marks fade from it.', '6');
      else { dropNear(P.x, P.y, plain); msg('The stone returns spent, and you drop it.', '6'); }
      break;
    }
  }
}

/* --------------------------------------------------- conjured barriers
   The wall forms two squares away, across the line you are facing. */
function buildWall(dx, dy, kind) {
  var ox = P.x + dx * 2, oy = P.y + dy * 2;
  var px = -dy, py = dx;               /* perpendicular */
  var made = 0;
  for (var i = -1; i <= 1; i++)
    if (placeTempWall(ox + px * i, oy + py * i, kind)) made++;
  if (!made) {
    for (i = -1; i <= 1; i++)
      if (placeTempWall(P.x + dx + px * i, P.y + dy + py * i, kind)) made++;
  }
  return made;
}

/* A spider of your own, off a witch's ring.  One at a time: the ring
   knows whether the last one is still on its feet, and will not call
   another until it is not. */
function yourSpider() {
  for (var i = 0; i < L.mons.length; i++)
    if (L.mons[i].ally && L.mons[i].c === 'E') return L.mons[i];
  return null;
}
function ringSpider(it) {
  if (yourSpider()) {
    msg('Your spider is already at your heel.', '6');
    return false;
  }
  var spots = [], dx, dy;
  for (dy = -2; dy <= 2; dy++) for (dx = -2; dx <= 2; dx++) {
    if (!dx && !dy) continue;
    var x = P.x + dx, y = P.y + dy;
    if (!walkable(x, y) || monAt(L, x, y) || barrelAt(x, y)) continue;
    if (!losClear(P.x, P.y, x, y)) continue;
    spots.push([x, y]);
  }
  if (!spots.length) { msg('There is nowhere for it to stand.', '6'); return false; }
  if (!keepsCharge(it)) { it.ch--; it.wind = 0; }
  shuffle(spots);
  var m = mkMonster('E', Math.max(1, G.depth), spots[0][0], spots[0][1]);
  m.ally = 1; m.state = 2; m.surprised = 0; m.disguise = 0;
  m.life = WITCH_SPIDER_LIFE;
  m.item = null; m.gold = 0;
  L.mons.push(m);
  msg('A spider climbs out of the ring.', 'P');
  sound('magic');
  computeVis();
  return true;
}

/* --------------------------------------------------------- summoning */
function summonAid(n) {
  var spots = [], dx, dy, made = 0;
  for (dy = -2; dy <= 2; dy++) for (dx = -2; dx <= 2; dx++) {
    if (!dx && !dy) continue;
    var x = P.x + dx, y = P.y + dy;
    if (!walkable(x, y) || monAt(L, x, y)) continue;
    if (!losClear(P.x, P.y, x, y)) continue;
    spots.push([x, y]);
  }
  shuffle(spots);
  for (var i = 0; i < n && i < spots.length; i++) {
    var c = spots[i];
    var m = mkMonster(randMonsterChar(Math.max(1, G.depth - 2)), G.depth, c[0], c[1]);
    m.ally = 1; m.state = 2; m.surprised = 0; m.disguise = 0;
    m.life = 45 + rnd(35);
    L.mons.push(m);
    made++;
  }
  return made;
}

/* a bolt looks nothing like an arrow, in the quiver or in the air */
function arrowSprite(d, ammo) {
  var base = 'arrow';
  if (d[0] > 0) return base + '_e';
  if (d[0] < 0) return base + '_w';
  if (d[1] < 0) return base + '_n';
  return base + '_s';
}

/* ------------------------------------------------- scroll-on-an-item
   These are the scrolls you aim at something in your pack.  Until the
   scroll is identified you have no idea whether it will bless the thing
   or ruin it. */
function enchantable(it) {
  return it && (it.t === 'weapon' || it.t === 'ring' || isGear(it));
}
/* A magical pin: fasten it to a piece of clothing and something happens
   to it.  Usually good, sometimes not, and you find out either way. */
function pinOnto(it) {
  if (!it || !isGear(it)) {
    msg('A pin goes on clothing, not on that.', '6');
    return false;
  }
  if (squibbed('pin')) return false;
  var r = rnd(100);
  it.known = 1;
  if (r < 42) {
    /* a plain improvement */
    it.ap += 1 + (rnd(100) < 25 ? 1 : 0);
    liftCurse(it);
    msg('The pin sinks in. ' + cap(itemName(it)) + '.', 'G');
  } else if (r < 76) {
    /* an enchantment, if there is room for one */
    if (it.br) {
      it.ap += 1;
      msg('It is already spoken for. ' + cap(itemName(it)) + '.', 'c');
    } else {
      addRune(it, gearRuneKind(it), 100);
      learnRune(it);             /* you watched it go in */
      var rn = runeDef(it);
      if (rn && rn.bad) msg('The pin blackens. ' + cap(itemName(it)) + '.', 'R');
      else msg('The pin glows. ' + cap(itemName(it)) + '.', 'G');
    }
  } else if (r < 90) {
    /* a curse */
    it.ap -= 1 + rnd(2);
    layCurse(it);
    seeCurse(it);              /* you watched it happen */
    msg('The pin bites you. ' + cap(itemName(it)) + '.', 'R');
    msg('It is cursed!', 'R');
  } else {
    msg('The pin crumbles to dust. Nothing happens.', '6');
  }
  return true;
}

function applyScrollTo(kind, it, scrollK) {
  var ok = true;
  switch (kind) {
    case 'pin':
      pinOnto(it);
      break;
    case 'identify':
      identifyItem(it);
      break;
    case 'remove curse':
      if (!it.cursed) {
        msg(cap(itemName(it)) + ' was never cursed.', '6');
        ok = false;
        break;
      }
      liftCurse(it);
      it.known = 1;
      msg('The curse lifts from ' + itemName(it) + '.', 'G');
      break;
    case 'return': {
      if (!canReturn(it)) {
        msg('The scroll crumbles. That is not something you throw.', '6');
        ok = false; break;
      }
      /* The charm will only hold one thing at a time.  Reading it over
         something new lets go of whatever had it before. */
      var had = returningItem();
      setReturning(it);
      it.known = 1;
      if (had && had !== it)
        msg('The charm leaves ' + itemName(had) + ' and settles on ' +
            itemName(it) + '.', 'c');
      else
        msg(cap(itemName(it)) + ' will come back to your hand.', 'G');
      break;
    }
    case 'charging': {
      var got = chargeItem(it);
      if (!got) { msg('The scroll crumbles. Nothing happens.', '6'); ok = false; break; }
      it.known = 1;
      if (got.kind === 'wand')
        msg(cap(itemName(it)) + ' hums: ' + got.from + ' charges become ' + got.to + '.', 'c');
      else if (got.kind === 'returns')
        msg(cap(itemName(it)) + ' will come back ' + got.to + ' times now, not ' +
            got.from + '.', 'c');
      else if (got.kind === 'sturdy')
        msg(cap(itemName(it)) + ' hardens. It will survive a throw far more often.', 'c');
      else
        msg(cap(itemName(it)) + ' takes on a charge. ' + got.bonus +
            ' more use' + (got.bonus > 1 ? 's' : '') + '.', 'c');
      break;
    }
    case 'enchantment':
      if (!enchantable(it)) { msg('The scroll crumbles. Nothing happens.', '6'); ok = false; break; }
      bumpItem(it, 1); liftCurse(it); it.known = 1;
      msg(cap(itemName(it)) + ' glows silver for a moment.', 'c');
      cutRune(it, SCROLL_RUNE_PCT);
      break;
    case 'greater enchantment':
      if (!enchantable(it)) { msg('The scroll crumbles. Nothing happens.', '6'); ok = false; break; }
      bumpItem(it, 2); liftCurse(it); it.known = 1;
      msg(cap(itemName(it)) + ' blazes with white light!', 'y');
      cutRune(it, SCROLL_RUNE_GREAT_PCT);
      break;
    case 'malediction':
      if (!enchantable(it)) { msg('The scroll crumbles. Nothing happens.', '6'); ok = false; break; }
      bumpItem(it, -1); layCurse(it); it.known = 1;
      msg(cap(itemName(it)) + ' turns black and cold. It is cursed!', 'R');
      break;
    case 'protect armor':
      if (!isGear(it)) { msg('That cannot be protected.', '6'); ok = false; break; }
      it.protected = 1;
      msg(cap(itemName(it)) + ' is sheathed in a golden shimmer.', 'y');
      break;
  }
  if (ok && scrollK !== undefined) KNOWN.scr[scrollK] = 1;
  return ok;
}
/* A scroll of enchantment on something that has no magic in it yet can
   put some there.  Only on a bow, and only if the bow is plain: the
   scroll's job is still the plusses, and this is the rarer thing that
   happens on top of them. */
function cutRune(it, chance) {
  if (!it || it.br) return 0;
  if (it.t !== 'weapon' || !WEAPONS[it.k].launch) return 0;
  addRune(it, 'wb', chance);
  if (!it.br) return 0;
  learnRune(it);                 /* you watched it being worked in */
  var rn = runeDef(it);
  msg('Something is worked into the wood. ' + cap(itemName(it)) + '.',
      rn && rn.bad ? 'R' : 'G');
  return 1;
}

function bumpItem(it, d) {
  /* A ring has no edge and no plate.  What a scroll does for it is wind
     it back up faster - or, cut the wrong way, slower. */
  if (it.t === 'ring') {
    it.quick = clamp((it.quick || 0) + d, -RING_QUICK_MAX, RING_QUICK_MAX);
    return;
  }
  if (it.t === 'weapon') {
    if (d > 0) { it.hp += d; it.dp += (d > 1 ? 1 : 0); }
    else { it.hp += d; }
  } else it.ap += d;
}

/* --------------------------------------------------- healing crystal */
function useCrystal(it) {
  if (squibbed('crystal')) return false;
  if (P.hp >= P.mhp) { msg('You are unhurt. The crystal stays cold.', '6'); return false; }
  var pct = CRYSTAL_MIN_PCT + rnd(CRYSTAL_MAX_PCT - CRYSTAL_MIN_PCT + 1);
  var heal = Math.max(1, Math.round(P.mhp * pct / 100));
  var hb3 = P.hp;
  P.hp = Math.min(P.mhp, P.hp + heal);
  holdHp(hb3, P.mhp);
  removeItem(it, 1);
  msg('The crystal warms and crumbles. ' + heal + ' hit points return.', 'G');
  return true;
}

/* ------------------------------------------------------------- blink */
function blinkTo(x, y) {
  if (Math.max(Math.abs(x - P.x), Math.abs(y - P.y)) > BLINK_RANGE) return false;
  if (monAt(L, x, y)) { msg('Something is already standing there.', 'R'); return true; }

  warpAway(P, P.x, P.y);
  P.x = x; P.y = y;
  computeVis();
  /* Through the wall is allowed.  Into it is not survivable. */
  if (!walkable(x, y)) {
    msg('You teleport into a wall and die!', 'R');
    hurtPlayer(P.hp + 1, 'blinking into solid rock');
    return true;
  }
  msg('The world lurches sideways.', 'P');
  afterStep();
  return true;
}

/* ------------------------------------------------------------- rings
   A ring of fire or of ice throws the same bolt a wand of fire or cold
   would, a little softer, and it costs a charge.  Aimed like a wand, so
   it goes down the same path and lands on the same creature. */
function zapRing(it, dx, dy) {
  breakClearwater('You give yourself away.');
  if (it.ch <= 0) { msg('The ring is cold and quiet.', '6'); return true; }
  var kind = RINGS[it.k].aim;
  if (!keepsCharge(it)) { it.ch--; it.wind = 0; }
  var path = [], x = P.x, y = P.y, i;
  for (i = 0; i < RING_BEAM_RANGE; i++) {
    x += dx; y += dy;
    if (isDoorish(x, y)) { path.push([x, y]); break; }
    if (blocksShot(x, y)) break;
    path.push([x, y]);
  }
  G.bolt = { path: path.slice(), kind: kind, mode: 'beam', dir: [dx, dy], t: nowMs() };
  sound('magic');
  var word = kind === 'fire' ? 'flame' : 'frost';
  var col = kind === 'fire' ? 'R' : 'c';
  msg('A lance of ' + word + ' leaps from the ring.', col);
  var pools = [], hits = 0;
  for (i = 0; i < path.length; i++) {
    var m = monAt(L, path[i][0], path[i][1]);
    if (m) {
      var d = elemDamage(m, perkElemental(roll(RING_BEAM[0], RING_BEAM[1]), kind), kind);
      hurtByPlayer(m); m.hp -= d;
      markHurt(m, P.x, P.y);
      hits++;
      if (m.hp <= 0) killMonster(m, true, d + (kind === 'fire' ? ' burn' : ' cold'));
      else {
        msgFight(fightLine(cap(word) + ' strikes ', monShort(m), '.'), col,
          d + (kind === 'fire' ? ' burn' : ' cold'), col, m);
        /* and then it does what fire and ice do */
        if (kind === 'fire') igniteMon(m, 'It catches light.');
        else freezeMon(m, 'It ices over.');
      }
    }
    if (isWater(path[i][0], path[i][1])) pools.push(path[i]);
  }
  if (kind === 'cold' && pools.length) conductPools(pools, 'cold');
  if (!hits) msg('It spends itself against the stone.', '6');
  computeVis();
  return true;
}
/* the ring of the seer: for a while, nothing on the floor is hidden */
function ringSeer(it) {
  if (!keepsCharge(it)) { it.ch--; it.wind = 0; }
  P.seer = Math.max(P.seer || 0, RING_SEER_TURNS);
  P.seeinv = Math.max(P.seeinv || 0, RING_SEER_TURNS);
  msg('The world sharpens. You see what is there.', 'P');
  computeVis();
  seerLook();
  return true;
}

/* the ring of light: the room, all of it, and it stays lit */
function ringLight(it) {
  if (!keepsCharge(it)) { it.ch--; it.wind = 0; }
  lightTheRoom('The ring blazes and the room comes up bright.',
               'The ring blazes, and the corridor swallows it.');
  return true;
}

/* ---------------------------------------------------------- identify */
function identifyItem(it) {
  if (!it) return;
  switch (it.t) {
    case 'potion': KNOWN.pot[it.k] = 1; break;
    case 'scroll': KNOWN.scr[it.k] = 1; break;
    case 'wand': KNOWN.wand[it.k] = 1; break;
    case 'ring': break;                       /* the name is on the band */
  }
  it.known = 1;
  learnRune(it);
  /* and now that you can put a name to this one, every other one of the
     kind is recognisable on sight - what any particular one is worth is
     still its own business */
  learnGear(it);
  msg('It is ' + itemName(it) + '.', 'c');
}

/* ---------------------------------------------------------- use */
function useItem(it) {
  if (!it) return { took: false };
  /* A stone has one obvious use, and it is not being worn.  ENTER on it
     does what the menu's Throw does. */
  if (it.t === 'weapon' && WEAPONS[it.k].thrown) return { took: false, hurl: it };
  switch (it.t) {
    case 'potion': return { took: quaff(it) };
    case 'scroll': return { took: readScroll(it) };
    case 'food': return { took: eat(it) };
    case 'crystal': return { took: useCrystal(it) };
    case 'wand':
      if (WANDS[it.k].blink && KNOWN.wand[it.k]) return { took: false, blink: it };
      return { took: false, aim: it };
    case 'ring':
      if (squibbed('ring')) return { took: false };
      if (RINGS[it.k].worn) {
        msg('It works by being carried, not pressed.', '6');
        return { took: false };
      }
      if (it.ch <= 0) { msg('The ring is cold and quiet.', '6'); return { took: false }; }
      /* fire and ice are pointed at something; light needs no aiming,
         because a room is not in any particular direction */
      if (RINGS[it.k].aim) return { took: false, aim: it };
      if (RINGS[it.k].light) return { took: ringLight(it) };
      if (RINGS[it.k].seer) return { took: ringSeer(it) };
      if (RINGS[it.k].spider) return { took: ringSpider(it) };
      /* the untouched puts you elsewhere; the other one puts you out of
         sight where you stand */
      if (RINGS[it.k].invis) {
        if (!keepsCharge(it)) { it.ch--; it.wind = 0; }
        P.unseen = Math.max(P.unseen, RING_INVIS_TURNS);
        msg('The world looks straight through you.', 'P');
        return { took: true };
      }
      return { took: false, blink: it };
    case 'pouch': return { took: false, pouch: it };
    case 'pin': return { took: false, pin: it };
    case 'dynamite': return { hurl: it };
    case 'weapon': case 'armor': case 'head': case 'feet': case 'shield': {
      var got = autoEquip(it);
      return { took: got, equipped: got };
    }
    case 'amulet':
      msg('The Amulet hums. Carry it up to the surface!', 'y');
      return { took: false };
  }
  return { took: false };
}

/* every line the inventory shows under an item's name: [text, colour] */
/* One line about the magic in a thing: what it does, that it is a mystery,
   or that there is nothing to know. */
function runeNote(it) {
  /* Knowing what the thing is and knowing what is worked into it are two
     different pieces of knowledge.  Wearing it gives you the first only.

     A thing you have identified and that has nothing in it says so - it
     is not a mystery, it is a plain sword.  Saying "enchantment unknown"
     of one was the first cut of this, and it turned every plain blade in
     the game into a maybe. */
  if (!it.known) return ['enchantment unknown', '4'];
  if (it.br && !it.brKnown) return ['enchantment unknown', '4'];
  var r = runeDef(it);
  if (r) return [r.txt, r.bad ? 'R' : 'G'];
  /* A plus or a property is an enchantment too, and it is already listed
     on its own line - so say nothing rather than contradict it. */
  var d = itemDef(it);
  if (it.ap || it.hp || it.dp || (d && d.prop)) return null;
  return ['no enchantment', '6'];
}
function pushNote(out, n) { if (n) out.push(n); }
function itemNotes(it) {
  if (!it) return [];
  var d = itemDef(it), out = [];
  if (it.chg > 0)
    out.push([isPlainAmmo(it) ? 'charged: it survives a throw'
      : it.chg + ' spare charge' + (it.chg > 1 ? 's' : ''), 'c']);
  if (it.known && isRuneStone(it) && WEAPONS[it.k].rune === 'return')
    out.push([(it.ret === undefined ? RETURN_USES : it.ret) + ' flights home left',
      (it.ret !== undefined && it.ret <= 3) ? 'O' : 'c']);
  if (it.homing) out.push(['charmed: it comes back to you', 'G']);
  switch (it.t) {
    case 'ring':
      out.push([d.txt, 'c']);
      if (d.worn) { out.push(['it works while you carry it', 'G']); break; }
      if (d.invis) out.push([RING_INVIS_TURNS + ' turns unseen a charge', 'c']);
      if (d.seer) out.push([RING_SEER_TURNS + ' turns of seeing all', 'c']);
      out.push([it.ch + ' of ' + ringCap(it) + ' charges', it.ch ? 'c' : 'O']);
      if (it.ch < ringCap(it))
        out.push([(ringWind(it) - (it.wind || 0)) + ' turns to the next', '6']);
      if (it.quick)
        out.push([(it.quick > 0 ? 'winds up ' : 'winds up ') +
          Math.abs(Math.round((1 - ringWind(it) / ringBaseWind(it)) * 100)) + '% ' +
          (it.quick > 0 ? 'faster' : 'slower'), it.quick > 0 ? 'G' : 'R']);
      break;
    case 'weapon':
      out.push(['damage ' + d.d[0] + 'd' + d.d[1], '6']);
      if (d.launch) out.push(['shoots ' + d.ammo + 's', 'c']);
      if (d.ammoFor)
        out.push([d.ammoText || ('for a ' + d.ammoFor + (d.alsoFor ? ' or ' + d.alsoFor : '')), 'c']);
      if (d.hurl) out.push(['wield or throw it; never lost', 'c']);
      if (numbersKnown(it) && (it.hp || it.dp))
        out.push([sgn(it.hp) + ' to hit, ' + sgn(it.dp) + ' damage',
          (it.hp + it.dp) < 0 ? 'R' : 'G']);
      pushNote(out, runeNote(it));
      break;
    case 'armor': case 'head': case 'feet': case 'shield':
      out.push(['protection ' + shownAC(it), '6']);
      /* What a thing does is exactly what identifying is for.  Printing
         "you blink at random" on an unknown pair of sandals gave the
         whole game away, curse and all. */
      if (d.prop && PROP_TEXT[d.prop] && numbersKnown(it))
        out.push(PROP_TEXT[d.prop].slice());
      if (numbersKnown(it) && it.ap) out.push([sgn(it.ap) + ' protection',
        it.ap < 0 ? 'R' : 'G']);
      pushNote(out, runeNote(it));
      if (it.protected) out.push(['protected from rust', 'c']);
      break;
    case 'potion':
      out.push([KNOWN.pot[it.k] ? 'you know this brew' : 'unknown - drink to learn',
        KNOWN.pot[it.k] ? '6' : '4']);
      break;
    case 'vial': {
      out.push(['too strong to drink - throw it', 'c']);
      if (!KNOWN.vial[it.k]) { out.push(['unknown - throw one to learn', '4']); break; }
      var vk = VIALS[it.k].n;
      if (vk === 'smoke')
        out.push(['fills ' + VIAL_FUME_REACH + ' squares with smoke', '6'],
          ['and hangs there ' + VIAL_SMOKE_TURNS[0] + '-' + VIAL_SMOKE_TURNS[1] + ' turns', '6']);
      else if (vk === 'poison')
        out.push(['fills ' + VIAL_FUME_REACH + ' squares with fumes', 'g'],
          ['they bite far harder than gas', 'g']);
      else if (vk === 'ice')
        out.push(['glazes ' + VIAL_ICE_REACH + ' squares with ice', 'c'],
          ['slippery, and it seals what is under it', 'c']);
      else if (vk === 'nitro')
        out.push(['goes off like a barrel of powder', 'R'],
          ['and takes the floor with it', 'R']);
      break;
    }
    case 'scroll':
      out.push([KNOWN.scr[it.k] ? 'you know this scroll' : 'unknown - read to learn',
        KNOWN.scr[it.k] ? '6' : '4']);
      if (KNOWN.scr[it.k] && d.pick) out.push(['you choose the target', 'c']);
      break;
    case 'wand':
      out.push([KNOWN.wand[it.k] ? it.ch + ' charges left' : 'unknown - zap to learn',
        KNOWN.wand[it.k] ? '6' : '4']);
      break;
    case 'food':
      out.push([FOODS[it.k].feed[0] >= 700 ? 'a meal: it fills you up'
        : 'a snack: it takes the edge off', '6']);
      break;
    case 'crystal': out.push(['heals ' + CRYSTAL_MIN_PCT + '-' + CRYSTAL_MAX_PCT + '% of your health', '6'],
      ['about ' + Math.max(1, Math.round(P.mhp * 0.175)) + ' hit points for you', 'c']); break;
    case 'dynamite': out.push(['throw it to blast stone', 'O'],
      ['four squares, and it hurts', '6']); break;
    case 'pin': out.push(['pin it on any clothing', '6'],
      ['it will change it somehow', 'y'],
      ['not always for the better', 'R']); break;
    case 'chest': out.push(['holds ' + CHEST_CAP + ' things', '6'],
      ['step on it to look inside', 'c']); break;
    case 'pouch': out.push(['holds ' + POUCH_CAP + ' things', '6'],
      ['SPACE opens it', 'c']); break;
    case 'key': out.push(['opens ' + MATS[it.k] + ' doors', '6'],
      ['and ' + MATS[it.k] + ' chests', '6']); break;
    case 'amulet': out.push(['carry it out to win', 'y']); break;
  }
  /* the weight in your hand tells you this much, name or no name */
  if (it.cursed && curseKnown(it)) {
    out.push(['CURSED - cannot be removed', 'R']);
    /* and which curse, once it is on you and has therefore been settled.
       "Cursed" on its own does not tell you why you are losing hit
       points in every puddle. */
    var cdn = it.curse ? curseDef(it.curse) : null;
    if (cdn) out.push([cdn.txt, 'R']);
  }
  return out;
}

function computeScore() {
  var s = P.gold + P.exp;
  if (P.amulet) s += 10000;
  return s;
}

/* ================================================================ INSPECT
   The box that opens on a thing in your pack.  Three pieces: what it
   looks like in the hand, what it does, and what is worth knowing about
   this particular one.

   The first of the three is the rule that matters: it describes what you
   can actually see.  An unidentified flask is a flask of coloured
   liquid, and saying "a clean red brew that smells of iron" over one you
   have never drunk would hand you the whole game. */
/* Do you know this well enough to know what it is worth?  A price is a
   fact about the thing itself, not about the one in your hand, so it
   waits until you can put a name to the kind. */
function worthKnown(it) {
  if (!it) return false;
  switch (it.t) {
    case 'potion': return !!KNOWN.pot[it.k];
    /* An unknown vial is worth a great deal or worth nothing, and which
       is exactly the thing the price would tell you. */
    case 'vial': return !!KNOWN.vial[it.k];
    case 'scroll': return !!KNOWN.scr[it.k];
    case 'wand': return !!KNOWN.wand[it.k];
    case 'ring': return !!it.known;
  }
  if (isGear(it) || it.t === 'weapon') return kindKnown(it);
  return true;
}
function loreFor(kind, name) {
  return (LORE[kind] && LORE[kind][name]) || LORE_KIND[kind] || '';
}
function itemLore(it) {
  if (!it) return '';
  var d = itemDef(it);
  switch (it.t) {
    case 'potion':
      if (KNOWN.pot[it.k]) return loreFor('potion', d.n);
      return 'A stoppered flask of ' + APPEAR.pot[it.k] + ' liquid. There is no telling ' +
             'what is in it until somebody drinks it.';
    case 'scroll':
      if (KNOWN.scr[it.k]) return loreFor('scroll', d.n);
      return 'A rolled sheet titled "' + APPEAR.scr[it.k] + '". The words mean nothing ' +
             'until they are read out.';
    case 'wand':
      if (KNOWN.wand[it.k]) return loreFor('wand', d.n);
      return cap(artic(APPEAR.wand[it.k])) + '. What it is for is anybody\'s guess ' +
             'until it is pointed at something.';
    case 'ring':
      if (it.known) return loreFor('ring', d.n);
      return 'A ring, and a ring tells you nothing. What it is for is its own business ' +
             'until you have worn it.';
    case 'food': return loreFor('food', FOODS[it.k].n);
    case 'crystal': return loreFor('other', 'crystal');
    case 'dynamite': return loreFor('other', 'dynamite');
    case 'pin': return loreFor('other', 'pin');
    case 'key': return 'A heavy ' + MATS[it.k] + ' key, cut for one lock and no other.';
    case 'chest': return loreFor('other', 'chest');
    case 'pouch': return loreFor('other', 'pouch');
    case 'amulet': return loreFor('other', 'amulet');
    case 'gold': return loreFor('other', 'gold');
  }
  if (isGear(it) || it.t === 'weapon') {
    /* A piece of kit you have not placed yet is described by its look
       and its shape, which is all you have to go on. */
    if (hidesItsName(it))
      return cap(artic(looksLike(it))) + '. Nobody can say what a piece of kit is worth ' +
             'until they have had it on.';
    return loreFor(it.t, d.n);
  }
  return '';
}
/* The second and third pieces: everything the panel says, and then the
   rest of it - the part there was never room for beside the pack. */
function itemDetail(it) {
  if (!it) return [];
  var out = itemNotes(it).slice(), d = itemDef(it), i;
  function add(s, c) { out.push([s, c || '6']); }
  switch (it.t) {
    case 'potion':
      add('drink it, or hurl it at something', 'c');
      add('a mouthful takes the edge off your hunger', '6');
      break;
    case 'scroll':
      add('read it aloud to use it', 'c');
      if (KNOWN.scr[it.k] && d.txt) add(d.txt, '6');
      break;
    case 'wand':
      if (KNOWN.wand[it.k]) {
        add('zap it down a row of squares', 'c');
        if (d.txt) add(d.txt, '6');
      } else add('zapping one is how you learn it', '4');
      break;
    case 'gold': add('it counts towards your score', 'y'); break;
    case 'crystal': add('crush it; it takes no turn to swallow', 'c'); break;
    case 'key': add('it stays on your belt, not in the pack', '6'); break;
  }
  if (it.t === 'weapon') {
    if (d.two) add('both hands, so no shield', 'O');
    /* What actually happens to a runed stone when it goes off.  It used
       to say the rune was spent by one throw, which was never true of
       the returning stone and is no longer true of any of them. */
    if (d.rune === 'return') add('it flies back to your hand', 'G');
    else if (d.rune) {
      add('the rune goes off where it lands', '6');
      add('about ' + runeKeepPct() + ' throws in a hundred leave it whole', 'c');
    }
  }
  if (isGear(it) && d.norust) add('nothing corrodes it', 'c');
  /* What it would fetch - but only once you know what it is.  A flask
     worth two hundred gold is obviously not the thirst quencher, so
     printing the price over an unknown one hands you the answer. */
  if (d && d.w && worthKnown(it)) add('worth about ' + d.w + ' gold', 'y');
  if (it.br && !it.brKnown) add('there is magic in it you cannot read', 'p');
  if (!numbersKnown(it) && (isGear(it) || it.t === 'weapon'))
    add('study it, or read a scroll over it, to learn its worth', '4');
  return out;
}

/* -------------------------------------------------- the box about you
   The panel beside the pack has room for four lines about the man
   himself.  This is the rest of it: what you are carrying into a fight,
   what it is worth in numbers, and how far down you have got. */
function selfDetail() {
  var out = [], w = P.eq.rh, d = w ? WEAPONS[w.k] : null;
  function add(s, c) { out.push([s, c || '6']); }
  function stat(n, v, m) { return n + ' ' + v + (v < m ? '(' + m + ')' : ''); }
  add('Level ' + P.lv + ', ' + xpText() + ' experience', 'w');
  add('Health ' + P.hp + ' of ' + P.mhp, P.hp * 2 < P.mhp ? 'R' : 'G');
  /* the three of them on one line, with what they were in brackets
     wherever something has drained one */
  add(stat('Str', effStr(), P.mstr) + '  ' + stat('Dex', effDex(), P.mdex) +
      '  ' + stat('Wis', effWis(), P.mwis),
    (P.str < P.mstr || P.dex < P.mdex || P.wis < P.mwis) ? 'R' : '6');
  add('Protection ' + playerAC() + ' from what you wear', 'c');
  add(w ? ('Armed with ' + itemName(w)) : 'Bare handed', w ? 'w' : 'O');
  if (d) add('It does ' + d.d[0] + 'd' + d.d[1] + ', ' + sgn(playerDamBonus()) + ' from you', '6');
  add('Sneak ' + stealthWord() + ', dodge ' + dodgeChance() + '%', 'c');
  add('Food ' + foodPct() + '% - ' + (G.hungerState ? foodWord() : 'not hungry'),
    G.hungerState ? 'O' : 'G');
  add('Gold ' + P.gold + ', pack ' + packCount() + ' of ' + N_SLOTS, 'y');
  add('Floor ' + (-G.depth) + ', turn ' + G.turn, '6');
  if (P.amulet) add('You are carrying the Amulet', 'y');
  return out;
}
/* ------------------------------------------------ the box of effects
   The same list the panel shows, with the explanation the panel has no
   room for.  Each entry is the short line, its colour, and a sentence
   underneath saying what it actually means for you. */
function effectsDetail() {
  var out = [], i;
  var short = playerEffects();
  for (i = 0; i < short.length; i++) out.push([short[i][0], short[i][1], '']);
  function explain(match, words) {
    for (var j = 0; j < out.length; j++)
      if (!out[j][2] && out[j][0].indexOf(match) === 0) { out[j][2] = words; return; }
  }
  explain('CURSED', 'A curse works on you until it is lifted at a shrine or read off you.');
  explain('hungry', 'Your wounds close half as fast until you eat something.');
  explain('weak', 'You heal not at all until you eat something.');
  explain('starving', 'You are losing health every turn. Eat anything you have.');
  explain('confused', 'Your steps go where they like, not where you send them.');
  explain('blind', 'You cannot see the room, only what you can reach.');
  explain('hallucinating', 'Nothing down here is wearing its own face.');
  explain('hasted', 'You act twice for every turn the dungeon takes.');
  explain('stuck in web', 'The web holds you. More of it will not hold you longer.');
  explain('frozen solid', 'You can do nothing at all until the ice lets go.');
  explain('held fast', 'Something has you, and you are going nowhere until it stops.');
  explain('gripped', 'It has hold of you. Kill it or break away.');
  explain('monsters flee', 'Nothing down here will close with you while it lasts.');
  explain('seeing invisible', 'What is hiding from your eyes is not hiding from them now.');
  explain('unseen', 'Very little notices you at all until you strike something.');
  explain('ringed in fire', 'Anything that comes within reach of you catches light.');
  explain('monster sight', 'You feel every living thing nearby, through stone and dark alike.');
  explain('seeing all', 'Seams, traps and the invisible are all plain to you.');
  explain('in the dark', 'A dark room shows you one square unless your eyes are made for it.');
  explain('running', 'Running away from a fight is how a man goes over.');
  explain('hands glow', 'The next blow you land leaves it reeling.');
  explain('carrying the Amulet', 'Carry it up the stairs and out, and the run is won.');
  /* the perks and the runes explain themselves - they have a long form
     already, written for the box that offers them */
  var pk = perkList();
  for (i = 0; i < pk.length; i++)
    if (pk[i].txt && pk[i].txt !== pk[i].s) explain(pk[i].n + ':', cap(pk[i].txt) + '.');
  var eq = equippedItems();
  for (i = 0; i < eq.length; i++) {
    var rn = activeRune(eq[i]);
    if (rn && rn.txt) explain(runeEffect(eq[i], rn), cap(rn.txt) + ', on your ' +
      shortItem(eq[i]) + '.');
    var dd = itemDef(eq[i]);
    if (dd && dd.prop && PROP_TEXT[dd.prop])
      explain(PROP_TEXT[dd.prop][0], 'From your ' + shortItem(eq[i]) + '.');
  }
  return out;
}

/* ============================================================ ROGUE-8
   Part 4 : renderer (true 320x200), inventory screen, input, main loop.
   ============================================================ */

var cv, cx, atlasImg, splashImg, fonts = {}, hurtSheet = null, dimSheet = null,
    smokeSheet = null, ready = false;
/* The page that wraps these files names the splash screen.  Nothing else
   does - not the test harness, which loads the parts on their own - so
   the file's own name is the fallback rather than a crash at boot. */
if (typeof SPLASH_PNG === 'undefined') var SPLASH_PNG = 'PXLRogue_splash.png';
/* One pre-faded copy of the sheet per shade the map is drawn at, keyed by
   that shade.  A corner patch is two pixels of the *other* material laid
   over a tile, so it has to cover what is under it rather than mix with
   it - which means taking its colour from a sheet already faded to the
   same amount.  There used to be exactly one of these, faded to the
   remembered shade, and it was used for every tile that was not at full
   brightness: with a third stage of light the corners of every dimmed
   wall came out at the darkness of a wall you were only remembering. */
var fadeSheets = {};
var IX = ATLAS.index, FNT = ATLAS.font;

/* Ambient opacity.  Every drawing helper used to reset globalAlpha to 1
   when it was done, which meant nothing could fade a group of things as
   a whole.  They now compose with this instead, so withAlpha() can dim a
   whole grid while the pieces keep their own alphas. */
var ALPHA = 1;
function withAlpha(a, fn) {
  var prev = ALPHA;
  ALPHA = prev * a; cx.globalAlpha = ALPHA;
  fn();
  ALPHA = prev; cx.globalAlpha = prev;
}

/* how strongly a remembered square is drawn, and what it fades towards */
var DIM_A = 0.34, BG_COL = '#0b0d1c';

var COLS = {
  w: '#ffffff', '6': '#c3ccd9', '4': '#636d85', '3': '#3f4966', y: '#fad039',
  O: '#f59e0b', R: '#d82b2b', r: '#8a202b', G: '#93bd27', g: '#2f9e44',
  c: '#74d6e8', B: '#1f8fd8', P: '#b26ce0', p: '#6b2f9c', k: '#d29d63',
  n: '#452d1e'
};

/* inventory geometry */
var SL = INV_SL, GAP = INV_GAP, PITCH = INV_PITCH;
/* The squares sit one pixel higher than the labels above them would
   suggest.  There were two spare pixels under RH BD LH HD FT, so the
   whole grid comes up one without the labels moving and without any of
   it looking any different - and the pixel that buys, together with the
   one spare row at the very bottom, makes the buttons two pixels taller
   so their text can sit squarely in the middle of them. */
var GX = INV_GX, MSG_Y = 1, TITLE_Y = 12, LABEL_Y = 12, GY_EQ = 20, GY_BAG = 42;
/* The wide, short buttons under the four rows of the bag.  The last row
   of squares ends at 117 and the screen is 128 tall, so there are ten
   pixels to work with and the buttons are shorter than a square. */
var BTN_H = 11, BTN_Y = GY_BAG + 3 * PITCH + SL + 1;

/* the left hand panel: a log that keeps several turns of text, and your
   stats pinned to the bottom where they never move */
var PX0 = 1;                       /* left margin inside the panel */
var LOG_Y = 2, LOG_LINE = 7, LH = 7;
var STAT_ROW = 9, STAT_COL = 39;
/* the stats block: a health meter with your purse beside it, then two
   rows of numbers underneath */
var STAT_H = 39, HP_BAR_H = 7;
/* The stats sit on the floor of the panel and everything else stacks up
   from there: flags on the very bottom line, three rows of numbers above
   them, then whatever is currently trying to kill you, then the log. */
var FLAG_Y = 0, STAT_Y = 0;        /* both fixed up from the font at boot */
/* the row of buttons along the floor of the panel, likewise */
var PANEL_BTN_H = 0, PANEL_BTN_Y = 0;
var BATTLE_ROW = 9;
var LOG_W = 0;                     /* worked out from the font at boot */

/* ---------------------------------------------------------- boot */
function boot() {
  cv = document.getElementById('scr');
  cv.width = SW; cv.height = SH;
  cx = cv.getContext('2d', { alpha: false });
  cx.imageSmoothingEnabled = false;

  /* The painted title screen, a file beside the page like the sheet is.
     Nothing waits on it: if it never loads, drawTitle falls back to a
     plain dark screen and the menu works just the same. */
  splashImg = new Image();
  splashImg.src = SPLASH_PNG;

  atlasImg = new Image();
  /* The sheet is a file beside this one, not a copy welded into it: what
     is painted in spritesheet.png is what the game draws with, and there
     is nothing to rebuild after painting it. */
  atlasImg.onerror = function () {
    var box = document.getElementById('nosheet');
    if (box) box.style.display = 'flex';
  };
  atlasImg.onload = function () {
    /* The sheet and the layout have to agree.  They are two files, and a
       browser - or a CDN in front of one - will happily serve yesterday's
       sheet beside today's HTML: the game then runs perfectly and cuts
       every sprite out of the wrong cell, which looks like a bug in the
       drawing rather than like a stale file.  The URL carries a stamp of
       the sheet's own contents to stop that happening; this is the net
       under it, so that if it ever does happen it SAYS so. */
    if (atlasImg.naturalWidth && (atlasImg.naturalWidth !== ATLAS.atlasW ||
                                  atlasImg.naturalHeight !== ATLAS.atlasH)) {
      var box2 = document.getElementById('nosheet');
      if (box2) {
        box2.innerHTML = 'spritesheet.png is ' + atlasImg.naturalWidth + 'x' +
          atlasImg.naturalHeight + ', and this build wants ' + ATLAS.atlasW + 'x' +
          ATLAS.atlasH + '.<br>The two files have come apart - the page is ' +
          'probably running from a stale cache.<br>Reload with SHIFT held down.';
        box2.style.display = 'flex';
      }
      return;
    }
    var keys = Object.keys(COLS);
    for (var i = 0; i < keys.length; i++) fonts[keys[i]] = makeFont(COLS[keys[i]]);
    hurtSheet = makeTint('#d82b2b');
    smokeSheet = makeTint(SMOKE_COL);
    dimSheet = makeDim();
    soundStart();
    loadCrt();
    fitBars();
    ready = true;
    newGame(true);
    playtestMenu();   /* ask, rather than open on the title */
    requestAnimationFrame(loop);
  };
  atlasImg.src = ATLAS_PNG;

  window.addEventListener('resize', fit);
  window.addEventListener('keydown', onKey, false);
  window.addEventListener('keyup', onKeyUp, false);
  window.addEventListener('blur', onBlur, false);
  /* The mouse listens on the canvas, not the window: the pointer is only
     ours while it is over the picture. */
  cv.addEventListener('mousemove', onMouseMove, false);
  cv.addEventListener('mousedown', onMouseDown, false);
  cv.addEventListener('mouseup', onMouseUp, false);
  /* Three ways out of the picture, and all of them count: off the edge
     of the canvas, off the edge of the page, and away from the window
     altogether.  mouseout alone missed the last two. */
  cv.addEventListener('mouseout', onMouseOut, false);
  cv.addEventListener('mouseleave', onMouseOut, false);
  window.addEventListener('mouseout', function (e) {
    if (!e.relatedTarget && !e.toElement) onMouseOut();
  }, false);
  window.addEventListener('blur', onMouseOut, false);
  /* the right button is the game's, not the browser's */
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
  /* A finger works the same controls.  Not passive: these have to be
     able to refuse the browser's own scrolling and zooming, and refusing
     them is also what stops a tap arriving a second time as a
     mouse click and lighting the arrow up. */
  cv.addEventListener('touchstart', onTouchStart, { passive: false });
  cv.addEventListener('touchmove', onTouchMove, { passive: false });
  cv.addEventListener('touchend', onTouchEnd, { passive: false });
  cv.addEventListener('touchcancel', onTouchCancel, { passive: false });
  /* two fingers on a trackpad, or a wheel: both push the map */
  cv.addEventListener('wheel', onWheel, { passive: false });
  /* the visible area is not the window on a phone: the address bar comes
     and goes, and turning it sideways changes everything */
  window.addEventListener('orientationchange', fit);
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', fit);
  fit();
}

/* The sheet a third time, already faded onto the background colour.

   Remembered squares are drawn at DIM_A, and a rounded corner is a two
   pixel patch of the *other* material laid over the tile.  Painting that
   patch at DIM_A blends it with the wall underneath instead of replacing
   it, so out of sight the wall showed through and the corner stopped
   looking rounded.  Blitting from this pre-faded sheet at full opacity
   lands on exactly the colour a dim tile has, and covers what is there. */
function makeFade(a) {
  var c = document.createElement('canvas');
  c.width = ATLAS.atlasW; c.height = ATLAS.atlasH;
  c.kind = 'dim'; c.tint = BG_COL; c.shade = a;
  var g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(atlasImg, 0, 0);
  /* fade towards the background, keeping the sprite's own silhouette */
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = 1 - a;
  g.fillStyle = BG_COL; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function makeDim() { return makeFade(DIM_A); }

/* The sheet again, in one flat colour.  Laid over a sprite at part
   opacity it reads as a hit without hiding what was struck. */
function makeTint(color) {
  var c = document.createElement('canvas');
  c.width = ATLAS.atlasW; c.height = ATLAS.atlasH;
  c.tint = color; c.kind = 'tint';
  var g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(atlasImg, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}

function makeFont(color) {
  var w = FNT.cols * FNT.cw, h = Math.ceil(FNT.count / FNT.cols) * FNT.ch;
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  c.tint = color; c.kind = 'font';
  var g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(atlasImg, FNT.x, FNT.y, w, h, 0, 0, w, h);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  return c;
}

/* --- integer-exact upscaling: snap to whole DEVICE pixels ------------ */
/* The room there actually is.  On a phone the window is not it: the
   address bar slides in and out, and window.innerHeight goes on
   reporting the taller figure.  visualViewport is what is really
   showing. */
function viewSize() {
  var vv = window.visualViewport;
  return { w: (vv && vv.width) || window.innerWidth,
           h: (vv && vv.height) || window.innerHeight };
}
function fit() {
  var dpr = window.devicePixelRatio || 1;
  var v = viewSize();
  var s = Math.floor(Math.min(v.w * dpr / SW, v.h * dpr / SH));

/* ------------------------------------------------- clicking the dungeon
   The left button sends you somewhere: to a square, up to a monster and
   into it, onto a thing to pick it up, onto a chest to open it.  The
   right button asks what you want done with whatever is there. */
function mapClick(mx, my, right) {
  var m = mouseTile();
  if (!m) return;
  if (G.walk) { stopWalk(null); if (!right) return; }
  if (right) { openCtxMenu(m.x, m.y); return; }
  /* Already waiting on the view?  Then this is a change of mind, and it
     is the square you asked for last that you get. */
  if (G.waiting) { G.waiting = { x: m.x, y: m.y }; return; }
  /* With yourself off the screen the view comes home first - and the
     order is kept, not thrown away, so the square you pointed at is the
     square you walk to once you can see yourself again.  Looking is
     still free: a right click is a question, not an order. */
  if (camHomeFirst()) { G.waiting = { x: m.x, y: m.y }; return; }
  mapOrder(m.x, m.y);
}

   between, and the same pixel is a different square by then. */
function mapOrder(mx2, my2) {
  var m = { x: mx2, y: my2 };
  beginAction();
  if (!(L.flags[m.y * MAP_W + m.x] & F_SEEN)) {
    /* Into the dark: you cannot know there is a floor there, so you go
       as near as the map you have allows and stop. */
    var d = unseenReach(m.x, m.y);

     no keyboard there was no way off the floor at all: walking onto one
     left you standing on it, and ENTER was the only thing that took it. */
  if (tileAt(m.x, m.y) === STAIR || tileAt(m.x, m.y) === STAIR_UP) {
    if (m.x === P.x && m.y === P.y) { beginAction(); tick(useStairs()); return; }
    walkTo(m.x, m.y, { stairs: 1 });
    return;
  }
  /* A locked door is a thing to go and try, not a square to stand on.
     Clicking one used to be answered with "You can't go there", which is
     true and useless: you walk over and put your hand to it instead. */
  if (tileAt(m.x, m.y) === LOCKED) {

      tick(mv);
      return;
    }

    return;

     that is simply walking at it; a click used to answer "You can't go
     there" and leave you standing where you were, so a whole way of
     playing was shut to the mouse. */
  if (isWallish(m.x, m.y)) {
    if (mdist({ x: m.x, y: m.y }) === 1) {
      var wm = playerMove(m.x - P.x, m.y - P.y);
      tick(wm);
      return;
    }
    walkTo(m.x, m.y, { feel: { x: m.x, y: m.y } });
    return;
  }

  if (foe && canSeeMon(foe) && !foe.ally) {
    if (mdist(foe) === 1) { playerAttack(foe); tick(true); return; }
    walkTo(m.x, m.y, { foe: foe });
    return;
  }

  if (it) {
    if (m.x === P.x && m.y === P.y) { tick(handPickup()); return; }
    walkTo(m.x, m.y, { what: it.t === 'chest' ? 'open' : 'get' });
    return;
  }

     the one square on the map a click did nothing at all with. */
  if (m.x === P.x && m.y === P.y) { openInv(); return; }
  walkTo(m.x, m.y, null);
}

/* ------------------------------------------------- the right-click menu

   the rest depend on what you are pointing at and what you are holding. */
function openCtxMenu(x, y) {

  if (foe && canSeeMon(foe) && !foe.ally && !mine && canShoot())
    opts.push(['shoot', 'Shoot']);

function ctxKey(k) {

    return;

    beginAction();

    var foe2 = monAt(L, x, y);
    if (!foe2 || !canSeeMon(foe2)) { msg('It is not there now.', '6'); finishMsgs(); return; }
    beginAction();
    tick(fireAt(foe2));
    return;
  }
  if (job === 'get' || job === 'open') {
    if (x === P.x && y === P.y) { beginAction(); tick(handPickup()); return; }
    walkTo(x, y, { what: job });

function drawCtxMenu() {
  var m = G.ctx, i, wide = 0;

    if (textW(m.opts[i][1]) > wide) wide = textW(m.opts[i][1]);
  var w = 9 + wide + 2, h = m.opts.length * LH + 4;

     it to the square meant working out where that square is drawn, and
     that has to agree with the camera down to the drag and the pan; the
     pointer is simply where it is. */

  var atx = (m.px !== undefined) ? m.px : (sq ? sq.px : VIEW_PX);
  var aty = (m.py !== undefined) ? m.py : (sq ? sq.py : VIEW_PY);

  var ay = clamp(aty + 3, 2, SH - 2 - h);

  for (i = 0; i < m.opts.length; i++) {
    var ty = ay + 2 + i * LH;
    hit(ax, ty - 1, w, LH, 'ctx', i);
    if (i === m.i) {
      rect(ax + 1, ty - 1, w - 2, LH, '#1b2a3d');
      spr('point', ax, ty - 2, 1);

/* The pack screen: a square, a button, or a row of the item menu. */
function invClick(h, right) {

  if (!h) { if (G.menu) closeItemMenu(); return; }
  if (h.what === 'menu') { G.menu.i = h.i; menuKey('Enter'); return; }
  if (G.menu) { closeItemMenu(); return; }
  /* The three panels down the right are things to press, not decoration:
     the top one opens the box about whatever the cursor is on, the
     middle one the box about you, the bottom one the box of effects. */
  if (h.what === 'panel') {

/* ---------------------------------------------------------- draw prims */
function spr(name, px, py, alpha) {
  var i = IX[name]; if (i === undefined) return;
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA * alpha;
  cx.drawImage(atlasImg, (i % ATLAS.cols) * TS, ((i / ATLAS.cols) | 0) * TS, TS, TS, px, py, TS, TS);
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA;
}

function sprFrom(sheet, name, px, py, alpha) {
  var i = IX[name]; if (i === undefined || !sheet) return;

  cx.drawImage(sheet, (i % ATLAS.cols) * TS, ((i / ATLAS.cols) | 0) * TS, TS, TS,
    px, py, TS, TS);

}
/* The same sprite, mirrored left to right.  A creature drawn facing one

}
/* The same sprite, mirrored either way or both and then turned in
   quarter circles clockwise.  A design that is symmetrical about its
   middle - a rug - is painted a quarter at a time and the other three
   quarters are the same tiles turned over; and a rug is woven upright,
   so one lying across a room is the whole of it turned a quarter.  The
   mirroring happens first, inside the turn, which is the order the rug
   was made in: woven, then laid down. */
function sprMirror(name, px, py, alpha, mx, my, quarters) {
  quarters = ((quarters || 0) % 4 + 4) % 4;
  if (!mx && !my && !quarters) { spr(name, px, py, alpha); return; }
  var i = IX[name]; if (i === undefined) return;
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA * alpha;
  cx.save();
  cx.translate(px + TS / 2, py + TS / 2);
  if (quarters) cx.rotate(quarters * Math.PI / 2);
  cx.scale(mx ? -1 : 1, my ? -1 : 1);
  cx.drawImage(atlasImg, (i % ATLAS.cols) * TS, ((i / ATLAS.cols) | 0) * TS, TS, TS,
    -TS / 2, -TS / 2, TS, TS);
  cx.restore();

}
/* Turned by any angle at all about its own middle.  Quarter circles

   circle comes out ragged, which for a spark is the point of it. */
function sprSpin(name, px, py, alpha, radians) {
  var i = IX[name]; if (i === undefined) return;
  if (!radians) { spr(name, px, py, alpha); return; }
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA * alpha;
  cx.save();
  cx.translate(px + TS / 2, py + TS / 2);
  cx.rotate(radians);
  cx.drawImage(atlasImg, (i % ATLAS.cols) * TS, ((i / ATLAS.cols) | 0) * TS, TS, TS,
    -TS / 2, -TS / 2, TS, TS);
  cx.restore();
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA;
}
/* and turned in quarter circles, clockwise, about its own middle */
function sprTurn(name, px, py, alpha, quarters) {
  var i = IX[name]; if (i === undefined) return;
  quarters = ((quarters % 4) + 4) % 4;
  if (!quarters) { spr(name, px, py, alpha); return; }
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA * alpha;
  cx.save();
  cx.translate(px + TS / 2, py + TS / 2);
  cx.rotate(quarters * Math.PI / 2);
  cx.drawImage(atlasImg, (i % ATLAS.cols) * TS, ((i / ATLAS.cols) | 0) * TS, TS, TS,
    -TS / 2, -TS / 2, TS, TS);
  cx.restore();
  if (alpha !== undefined && alpha !== 1) cx.globalAlpha = ALPHA;

function sprS(name, px, py, k) {
  var i = IX[name]; if (i === undefined) return;

    px, py, TS * k, TS * k);

function sprSC(name, py, k) { sprS(name, ((SW - TS * k) / 2) | 0, py, k); }

/* ---------------------------------------------------------- new game */
function newGame(first, slot) {
  /* RESTART starts another run in the slot the last one was in: you

     you are playing.  freshG wipes it, so it is kept here first. */

  if (slot === undefined || slot === null) slot = wasSlot;
  /* A run is seeded from the clock.  FORCED_SEED overrides it, which is
     how a test gets the same dungeon twice and how a strange floor can be
     looked at again instead of described from memory. */
  srand(FORCED_SEED || ((Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0));
  makeAppearances();
  G = freshG();
  P = newPlayer();

  /* You start with the worst of everything: a plain dagger, plain
     leather, a plain bow and a thin quiver.  Almost anything you find
     down there will be an improvement. */
  var dagger = mkItem('weapon', 2); dagger.known = 1;
  var body = mkItem('armor', 0); body.known = 1;
  P.eq.rh = dagger; P.eq.body = body;

  addItem(mkItem('food', 0));
  /* three stones and a dagger: everything else has to be found */

  /* one scroll of identify: enough to learn one thing you find */

     safe to do without asking: there is only ever one place it can go. */

  if (G.slot !== null && G.slot !== undefined) saveInto(G.slot);

/* ---------------------------------------------------------- messages */
/* Nothing has to be dismissed any more: everything said this turn joins
   the log on the left, where it stays until it scrolls off the top. */
function finishMsgs() {
  for (var i = 0; i < G.msgq.length; i++) logPush(G.msgq[i]);
  G.msgq = []; G.msgIdx = 0;
  resumeMode();
}
function logPush(m) {
  m.t = G.turn;
  G.log.push(m);
  if (G.log.length > 60) G.log.splice(0, G.log.length - 60);
  /* and the whole story of the run, which the panel has no room for and
     the T key does.  The panel's own list is trimmed hard because it is
     walked every frame; this one is only read when it is asked for. */
  G.hist = G.hist || [];
  G.hist.push({ s: m.s, c: m.c, fx: m.fx || '', fc: m.fc || '4', t: G.turn, d: G.depth });

function settleLog() {
  var now = nowMs(), i;
  for (i = 0; i < G.log.length; i++) if (G.log[i].at > now) G.log[i].at = now;

}
