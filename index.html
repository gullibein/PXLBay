<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PXL-OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: none !important;
      }
      
      * {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: none !important;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        cursor: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="os-canvas" width="640" height="340"></canvas>

    <script type="module" src="/src/main.ts"></script>
    <script>
      let manualScaleOverride = null;
      
      window.addEventListener('set-zoom', (e) => {
        const detail = e.detail;
        if (detail === 'normal' || detail === 'Normal' || detail === 0 || detail === null) {
          manualScaleOverride = null;
        } else if (typeof detail === 'number') {
          manualScaleOverride = detail;
        } else if (typeof detail === 'string' && detail.endsWith('x')) {
          manualScaleOverride = parseInt(detail, 10) || null;
        }
        updateScale();
      });

      function updateScale() {
        const cssWidth = window.innerWidth;
        const cssHeight = window.innerHeight;
        const isPortrait = cssHeight > cssWidth;

        let logicalWidth;
        let logicalHeight;
        let cssScale;

        if (manualScaleOverride) {
          cssScale = manualScaleOverride;
          logicalWidth = Math.floor(cssWidth / cssScale);
          logicalHeight = Math.floor(cssHeight / cssScale);
        } else {
          // Normal mode:
          if (isPortrait) {
            // Portrait: exactly 3 items fit across the screen (3 * 105 = 315px -> 320px)
            logicalWidth = 320;
            cssScale = cssWidth / logicalWidth;
            logicalHeight = Math.max(180, Math.floor(cssHeight / cssScale));
          } else {
            // Landscape: exactly 6 items fit across the screen (6 * 105 = 630px -> 640px)
            const integerScale = Math.max(1, Math.min(Math.floor(cssWidth / 640), Math.floor(cssHeight / 340)));
            if (cssWidth < 640 || cssHeight < 340) {
              logicalWidth = 640;
              cssScale = cssWidth / 640;
              logicalHeight = Math.max(180, Math.floor(cssHeight / cssScale));
            } else {
              cssScale = integerScale;
              logicalWidth = Math.floor(cssWidth / cssScale);
              logicalHeight = Math.floor(cssHeight / cssScale);
            }
          }
        }

        const canvas = document.getElementById('os-canvas');
        if (canvas.width !== logicalWidth || canvas.height !== logicalHeight) {
          canvas.width = logicalWidth;
          canvas.height = logicalHeight;
        }

        const currentZoomMode = manualScaleOverride ? `${manualScaleOverride}x` : 'Normal';
        window.dispatchEvent(new CustomEvent('os-resize', { 
          detail: { 
            width: logicalWidth, 
            height: logicalHeight, 
            scale: cssScale,
            zoomMode: currentZoomMode
          } 
        }));

        canvas.style.width = (logicalWidth * cssScale) + 'px';
        canvas.style.height = (logicalHeight * cssScale) + 'px';
      }
      window.addEventListener('resize', updateScale);
      updateScale();
    </script>
  </body>
</html>
