<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOSFake OS Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        cursor: none !important;
      }
      
      * {
        cursor: none !important;
      }

      canvas {
        image-rendering: pixelated;
        cursor: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="os-canvas" width="640" height="340"></canvas>

    <script type="module" src="/src/main.ts"></script>
    <script>
      let manualScaleOverride = null;
      
      window.addEventListener('set-zoom', (e) => {
        manualScaleOverride = e.detail;
        updateScale();
      });

      function updateScale() {
        const dpr = window.devicePixelRatio || 1;
        const physicalWidth = window.innerWidth * dpr;
        const physicalHeight = window.innerHeight * dpr;
        
        let physicalScale;
        if (manualScaleOverride) {
          physicalScale = manualScaleOverride * dpr;
        } else {
          // Find max integer scale that fits 640x340, but enforce minimum of 2x
          const maxFittingScale = Math.min(Math.floor(physicalWidth / 640), Math.floor(physicalHeight / 340));
          physicalScale = Math.max(2, maxFittingScale);
        }
        
        // Calculate dynamic logical size
        const logicalWidth = Math.floor(physicalWidth / physicalScale);
        const logicalHeight = Math.floor(physicalHeight / physicalScale);
        
        const canvas = document.getElementById('os-canvas');
        if (canvas.width !== logicalWidth || canvas.height !== logicalHeight) {
          canvas.width = logicalWidth;
          canvas.height = logicalHeight;
          // Notify the application of the new boundaries
          window.dispatchEvent(new CustomEvent('os-resize', { detail: { width: logicalWidth, height: logicalHeight, scale: physicalScale / dpr } }));
        }

        const cssScale = physicalScale / dpr;
        
        canvas.style.width = (logicalWidth * cssScale) + 'px';
        canvas.style.height = (logicalHeight * cssScale) + 'px';
      }
      window.addEventListener('resize', updateScale);
      updateScale();
    </script>
  </body>
</html>
