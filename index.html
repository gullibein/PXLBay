<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PXL-OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: none !important;
      }
      
      * {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: none !important;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        cursor: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="os-canvas" width="640" height="340"></canvas>

    <script type="module" src="/src/main.ts"></script>
    <script>
      let manualScaleOverride = null;
      
      window.addEventListener('set-zoom', (e) => {
        const detail = e.detail;
        if (detail === 'normal' || detail === 'Normal' || detail === 0 || detail === null) {
          manualScaleOverride = null;
        } else if (typeof detail === 'number') {
          manualScaleOverride = detail;
        } else if (typeof detail === 'string' && detail.endsWith('x')) {
          manualScaleOverride = parseInt(detail, 10) || null;
        }
        updateScale();
      });

      function updateScale() {
        const cssWidth = window.innerWidth;
        const cssHeight = window.innerHeight;
        const isPortrait = cssHeight > cssWidth;

        let logicalWidth;
        let logicalHeight;
        let integerScale;

        if (manualScaleOverride) {
          integerScale = Math.max(1, Math.round(manualScaleOverride));
          logicalWidth = Math.floor(cssWidth / integerScale);
          logicalHeight = Math.floor(cssHeight / integerScale);
        } else {
          // Normal mode: strict whole integer scaling (1x, 2x, 3x, 4x, etc.)
          if (isPortrait) {
            // On mobile portrait, 2x integer scale makes icons/text larger and easily readable
            if (cssWidth < 600) {
              integerScale = 2;
            } else {
              integerScale = Math.max(2, Math.floor(cssWidth / 320));
            }
            logicalWidth = Math.floor(cssWidth / integerScale);
            logicalHeight = Math.floor(cssHeight / integerScale);
          } else {
            // Target 6 items across in landscape (base 640x340)
            integerScale = Math.max(1, Math.min(Math.floor(cssWidth / 640), Math.floor(cssHeight / 340)));
            logicalWidth = Math.floor(cssWidth / integerScale);
            logicalHeight = Math.floor(cssHeight / integerScale);
          }
        }

        const canvas = document.getElementById('os-canvas');
        if (canvas.width !== logicalWidth || canvas.height !== logicalHeight) {
          canvas.width = logicalWidth;
          canvas.height = logicalHeight;
        }

        const currentZoomMode = manualScaleOverride ? `${manualScaleOverride}x` : 'Normal';
        window.dispatchEvent(new CustomEvent('os-resize', { 
          detail: { 
            width: logicalWidth, 
            height: logicalHeight, 
            scale: integerScale,
            zoomMode: currentZoomMode
          } 
        }));

        canvas.style.width = (logicalWidth * integerScale) + 'px';
        canvas.style.height = (logicalHeight * integerScale) + 'px';
      }
      window.addEventListener('resize', updateScale);
      updateScale();
    </script>
  </body>
</html>
